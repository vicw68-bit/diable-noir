class Effects {
  static COUNTER_IDS = ["MIRROR", "PROTECTION", "BACKFIRE"];

  static isDrinkEffect(cardType) {
    return cardType === "bonus" || cardType === "malus_target" || cardType === "malus_global";
  }

  static isUnplayable(cardId) {
    return cardId === "DIABLE_NOIR" || cardId === "CURSE";
  }

  static hasCurseInHand(player) {
    return player.hand?.some(c => c.id === "CURSE") ?? false;
  }

  static isShieldBlockable(attack) {
    if (!attack) return false;
    if (attack.kind === "drinks") return true;
    if (attack.kind === "skip") return true;
    return attack.cardType === "malus_target";
  }

  static isMalusAttack(attack) {
    return this.isShieldBlockable(attack);
  }

  static isPlusXCard(cardId) {
    return cardId === "PLUS2" || cardId === "PLUS3" || cardId === "PLUS5";
  }

  static isAllianceBlock(cardId) {
    return this.needsTarget(cardId);
  }

  static isProtected(player, cardType, cardId) {
    if (this.isDrinkEffect(cardType) && player.protection) return true;
    if (player.alliance && cardId && this.isAllianceBlock(cardId)) return true;
    if (player.alliance && (cardType === "malus_target" || cardType === "steal")) return true;
    return false;
  }

  static tryAutoShield(game, targetId, attack, messages) {
    const target = game.players[targetId];
    if (!target?.shieldActive || !this.isShieldBlockable(attack)) return false;
    target.shieldActive = false;
    messages.push(`🛡️ ${target.pseudo} — le Bouclier absorbe ${attack.cardName}!`);
    return true;
  }

  static getPlayerBadges(player) {
    const b = [];
    if (player.shieldActive) b.push("🛡️");
    if (player.frozen) b.push("❄️");
    if (this.hasCurseInHand(player)) b.push("☠️");
    if (player.protection) b.push("🔰");
    if (player.skip) b.push("⏭️");
    if (player.mirrorActive) b.push("🪞");
    if (player.backfire) b.push("🔥");
    if (player.doubleEffect) b.push("⚡");
    if (player.enemyOfPublic) b.push("👿");
    if (player.alliance) b.push("🤝");
    if (player.doubleDistBonus) b.push("👥");
    return b.join(" ");
  }

  static isPlusGiveCard(cardId) {
    return ["GIVE_2", "GIVE_3", "GIVE_5", "PLUS2", "PLUS3", "PLUS5"].includes(cardId);
  }

  static prepareDrinkAttack(card, targetId, game, casterId, messages) {
    const atk = this.getAttackDescriptor(card, targetId, game);
    if (!atk) return null;
    const caster = game.players[casterId];
    if (caster?.doubleDistBonus && this.isPlusGiveCard(card.id)) {
      caster.doubleDistBonus = false;
      atk.amount += 2;
      messages.push("👥 Double Distribution : +2 🍺 en plus!");
    }
    return atk;
  }

  static getAttackDescriptor(card, targetId, game) {
    if (!targetId || !game.players[targetId]) return null;
    const target = game.players[targetId];
    const base = { cardId: card.id, cardName: card.name, cardType: card.type };

    switch (card.id) {
      case "GIVE_2": return { ...base, kind: "drinks", amount: 2, cardType: "bonus" };
      case "GIVE_3": return { ...base, kind: "drinks", amount: 3, cardType: "bonus" };
      case "GIVE_5": return { ...base, kind: "drinks", amount: 5, cardType: "bonus" };
      case "PLUS2": return { ...base, kind: "drinks", amount: 2, cardType: "malus_target" };
      case "PLUS3": return { ...base, kind: "drinks", amount: 3, cardType: "malus_target" };
      case "PLUS5": return { ...base, kind: "drinks", amount: 5, cardType: "malus_target" };
      case "DOUBLE_PENALTY":
        return { ...base, kind: "drinks", amount: 2, cardType: "malus_target", delayedDrinks: 2 };
      case "RELENTLESS": {
        const amount = Object.keys(game.players).filter(id => id !== targetId).length;
        return { ...base, kind: "drinks", amount, cardType: "malus_target" };
      }
      case "SKIP": return { ...base, kind: "skip", cardType: "uno" };
      default: return null;
    }
  }

  static getAvailableCounters(hand, attack) {
    if (!attack) return [];
    return hand.map((c, i) => ({ card: c, index: i })).filter(({ card }) => {
      if (card.id === "PROTECTION") return attack.kind === "drinks";
      if (card.id === "MIRROR") return this.isMalusAttack(attack);
      if (card.id === "BACKFIRE") return attack.cardType === "malus_target";
      return false;
    });
  }

  static wouldShieldBlock(game, targetId, attack) {
    const target = game.players[targetId];
    return !!(target?.shieldActive && this.isShieldBlockable(attack));
  }

  static shouldOfferReaction(game, card, targetId, attackOverride = null) {
    const attack = attackOverride || this.getAttackDescriptor(card, targetId, game);
    if (!attack) return false;
    if (attack.kind === "steal") return false;
    if (this.wouldShieldBlock(game, targetId, attack)) return false;
    const target = game.players[targetId];
    if (attack.kind === "drinks" && this.isProtected(target, attack.cardType, attack.cardId)) return false;
    return this.getAvailableCounters(target.hand, attack).length > 0;
  }

  static applyDrinks(game, shared, targetId, amount, sourceId, cardType, messages, opts = {}) {
    if (amount <= 0) return false;

    let recipientId = targetId;
    let drinkAmount = amount;
    const cardId = opts.cardId || null;

    const source = sourceId ? game.players[sourceId] : null;
    const recipient = game.players[recipientId];

    if (source?.doubleEffect) {
      drinkAmount *= 2;
      source.doubleEffect = false;
      messages.push("⚡ Double Effet (carte jouée)!");
    }
    if (recipient?.doubleEffect && recipientId !== sourceId) {
      drinkAmount *= 2;
      recipient.doubleEffect = false;
      messages.push("⚡ Double Effet (carte reçue)!");
    }

    const target = game.players[recipientId];

    if (cardId && this.isPlusXCard(cardId) && target.enemyOfPublic) {
      drinkAmount += 1;
    }

    if (!opts.skipPassiveChecks) {
      if (this.isProtected(target, cardType, cardId)) {
        messages.push(`${target.pseudo} est protégé!`);
        return false;
      }
      if (target.mirrorActive && sourceId && sourceId !== recipientId && cardType === "malus_target") {
        target.mirrorActive = false;
        messages.push(`🪞 ${target.pseudo} renvoie l'effet à ${source.pseudo}!`);
        recipientId = sourceId;
      }
    }

    let victim = game.players[recipientId];

    if (!opts.skipPassiveChecks && victim.backfire && sourceId && sourceId !== recipientId && cardType === "malus_target") {
      victim.backfire = false;
      messages.push(`🔥 Retour de Flamme actif! ${source.pseudo} subit l'effet!`);
      recipientId = sourceId;
      victim = game.players[recipientId];
    }

    if (this.isProtected(victim, cardType, cardId)) {
      messages.push(`${victim.pseudo} est protégé!`);
      return false;
    }

    victim.drinks = (victim.drinks || 0) + drinkAmount;
    messages.push(`${victim.pseudo} boit ${drinkAmount} 🍺`);
    return true;
  }

  static applyAttack(game, shared, attack, targetId, casterId, messages) {
    if (this.tryAutoShield(game, targetId, attack, messages)) return;

    if (attack.kind === "drinks") {
      const hit = this.applyDrinks(game, shared, targetId, attack.amount, casterId, attack.cardType, messages, { cardId: attack.cardId });
      if (attack.delayedDrinks && hit) {
        game.players[targetId].delayedDrinks = (game.players[targetId].delayedDrinks || 0) + attack.delayedDrinks;
        messages.push(`→ +${attack.delayedDrinks} gorgées au prochain tour de ${game.players[targetId].pseudo}`);
      }
    } else if (attack.kind === "skip") {
      game.players[targetId].skip = true;
      messages.push(`→ ${game.players[targetId].pseudo} passe son prochain tour`);
    }
  }

  static reflectAttack(game, shared, attack, toPlayerId, fromPlayerId, messages) {
    if (attack.kind === "drinks") {
      this.applyDrinks(game, shared, toPlayerId, attack.amount, fromPlayerId, attack.cardType, messages, { skipPassiveChecks: true, cardId: attack.cardId });
      if (attack.delayedDrinks) {
        game.players[toPlayerId].delayedDrinks = (game.players[toPlayerId].delayedDrinks || 0) + attack.delayedDrinks;
        messages.push(`→ +${attack.delayedDrinks} gorgées différées pour ${game.players[toPlayerId].pseudo}`);
      }
    } else if (attack.kind === "skip") {
      game.players[toPlayerId].skip = true;
      messages.push(`→ ${game.players[toPlayerId].pseudo} passe son prochain tour`);
    }
  }

  static resolveReaction(game, shared, counterHandIndex) {
    const pr = shared.pendingReaction;
    if (!pr) return "";

    const messages = [];
    const target = game.players[pr.targetId];
    const caster = game.players[pr.casterId];
    const attack = pr.attack;

    messages.push(`⚔️ ${caster.pseudo} a visé ${target.pseudo} avec ${attack.cardName}`);

    if (counterHandIndex !== null && counterHandIndex !== undefined) {
      const counter = target.hand[counterHandIndex];
      if (!counter || !this.COUNTER_IDS.includes(counter.id)) return "";

      const allowed = this.getAvailableCounters(target.hand, attack);
      if (!allowed.some(a => a.index === counterHandIndex)) return "";

      target.hand.splice(counterHandIndex, 1);

      switch (counter.id) {
        case "PROTECTION":
          messages.push(`🔰 ${target.pseudo} joue Protection — gorgées annulées!`);
          break;
        case "MIRROR":
          messages.push(`🪞 ${target.pseudo} joue Miroir — renvoi à ${caster.pseudo}!`);
          this.reflectAttack(game, shared, attack, pr.casterId, pr.targetId, messages);
          break;
        case "BACKFIRE":
          messages.push(`🔥 ${target.pseudo} joue Retour de Flamme — renvoi à ${caster.pseudo}!`);
          this.reflectAttack(game, shared, attack, pr.casterId, pr.targetId, messages);
          break;
      }
    } else {
      messages.push(`${target.pseudo} ne contre pas.`);
      this.applyAttack(game, shared, attack, pr.targetId, pr.casterId, messages);
    }

    shared.pendingReaction = null;
    return messages.join("\n");
  }

  static drawCard(game, playerId) {
    if (game.deck.length > 0) {
      game.players[playerId].hand.push(game.deck.pop());
    }
  }

  static swapRandomWithNeighbor(game, direction) {
    const order = game.playerOrder;
    const dir = direction ?? game.gameDirection ?? 1;
    const picks = [];

    order.forEach(id => {
      const hand = game.players[id].hand;
      if (hand.length > 0) {
        const idx = Math.floor(Math.random() * hand.length);
        picks.push({ fromId: id, idx, card: hand[idx] });
      }
    });

    picks.sort((a, b) => b.idx - a.idx || b.fromId.localeCompare(a.fromId));
    picks.forEach(({ fromId, idx }) => game.players[fromId].hand.splice(idx, 1));

    picks.forEach(({ fromId, card }) => {
      const pos = order.indexOf(fromId);
      const neighborId = order[(pos + dir + order.length) % order.length];
      game.players[neighborId].hand.push(card);
    });
  }

  static swapRandomToRight(game) {
    this.swapRandomWithNeighbor(game, game.gameDirection || 1);
  }

  static apply(game, playerId, card, targetId, shared, opts = {}) {
    const players = game.players;
    const caster = players[playerId];
    const target = targetId ? players[targetId] : null;
    const messages = [`${caster.pseudo} joue ${card.name}`];

    switch (card.id) {
      case "GIVE_2":
      case "GIVE_3":
      case "GIVE_5":
      case "PLUS2":
      case "PLUS3":
      case "PLUS5":
      case "DOUBLE_PENALTY":
      case "RELENTLESS":
        if (!opts?.deferAttack) {
          const atk = this.isPlusGiveCard(card.id)
            ? this.prepareDrinkAttack(card, targetId, game, playerId, messages)
            : this.getAttackDescriptor(card, targetId, game);
          if (atk) {
            if (card.id === "RELENTLESS" && this.isProtected(target, "malus_target", "RELENTLESS")) {
              messages.push(`→ ${target.pseudo} est protégé!`);
            } else {
              this.applyAttack(game, shared, atk, targetId, playerId, messages);
              if (card.id === "RELENTLESS") messages.push(`→ acharnement (${atk.amount} gorgées)`);
            }
          }
        }
        break;

      case "DOUBLE_DISTRIBUTION":
        caster.doubleDistBonus = true;
        messages.push("→ 👥 prochaine carte Donne/+2/+3/+5 : +2 🍺 en plus sur la cible");
        break;

      case "DRAW_2":
        for (let i = 0; i < 2; i++) this.drawCard(game, playerId);
        messages.push("→ pioche 2 cartes");
        break;

      case "EXTRA_TURN":
        shared.extraTurn = true;
        messages.push("→ rejoue immédiatement");
        break;

      case "PROTECTION":
        if (target) {
          target.protection = true;
          messages.push(`→ 🔰 ${target.pseudo} protégé(e) contre la prochaine gorgée jusqu'à son prochain tour`);
        }
        break;

      case "GIFT":
        for (let i = 0; i < 2; i++) this.drawCard(game, targetId);
        messages.push(`→ ${target.pseudo} pioche 2 cartes`);
        break;

      case "ALLIANCE":
        Object.values(players).forEach(p => {
          if (p.alliance === playerId || p.alliance === targetId) p.alliance = null;
        });
        caster.alliance = targetId;
        target.alliance = playerId;
        messages.push(`→ 🤝 alliance entre ${caster.pseudo} et ${target.pseudo} (jusqu'au prochain tour de chacun)`);
        break;

      case "TRIBUNAL":
        messages.push("→ ⚖️ Tribunal ! Votez à l'oral pour qui boit 4 🍺");
        break;

      case "PUBLIC_ENEMY":
        target.enemyOfPublic = true;
        messages.push(`→ 👿 ${target.pseudo} Ennemi Public (+1 sur Donne +X jusqu'à son prochain tour)`);
        break;

      case "DRINK_2":
        this.applyDrinks(game, shared, playerId, 2, playerId, "malus_global", messages, { cardId: "DRINK_2" });
        break;
      case "DRINK_3":
        this.applyDrinks(game, shared, playerId, 3, playerId, "malus_global", messages, { cardId: "DRINK_3" });
        break;
      case "DRINK_5":
        this.applyDrinks(game, shared, playerId, 5, playerId, "malus_global", messages, { cardId: "DRINK_5" });
        break;

      case "ALL_EXCEPT_YOU":
        Object.keys(players).filter(id => id !== playerId).forEach(id => {
          this.applyDrinks(game, shared, id, 1, playerId, "malus_global", messages, { cardId: "ALL_EXCEPT_YOU" });
        });
        break;

      case "LEFT": {
        const order = game.playerOrder;
        const dir = game.gameDirection || 1;
        const idx = order.indexOf(playerId);
        const leftId = order[(idx - dir + order.length) % order.length];
        this.applyDrinks(game, shared, leftId, 3, playerId, "malus_global", messages, { cardId: "LEFT" });
        messages.push(`→ joueur à gauche: ${players[leftId].pseudo}`);
        break;
      }

      case "DISCARD": {
        const discardable = caster.hand.filter(c => !this.isUnplayable(c.id));
        if (discardable.length > 0) {
          const pick = discardable[Math.floor(Math.random() * discardable.length)];
          const idx = caster.hand.indexOf(pick);
          caster.hand.splice(idx, 1);
          messages.push("→ défausse une carte aléatoire");
        } else {
          messages.push("→ aucune carte défaussable");
        }
        break;
      }

      case "SHIELD":
        caster.shieldActive = true;
        messages.push("→ 🛡️ Bouclier actif — absorbe le prochain malus ciblé");
        break;
      case "MIRROR":
        caster.mirrorActive = true;
        messages.push("→ 🪞 Miroir actif — renvoie le prochain malus ciblé");
        break;
      case "DOUBLE_EFFECT":
        caster.doubleEffect = true;
        messages.push("→ ⚡ Double Effet actif sur ta prochaine carte à gorgées (jouée ou reçue)");
        break;
      case "BOMB":
        shared.bombActive = true;
        messages.push("→ 💣 le prochain joueur boit 5 🍺");
        break;
      case "BACKFIRE":
        caster.backfire = true;
        messages.push("→ 🔥 Retour de Flamme actif — renvoie le prochain malus ciblé");
        break;

      case "SPY":
        if (target) {
          const shown = target.hand.slice(0, 2).map(c => c.name).join(", ") || "(main vide)";
          messages.push(`→ 🕵️ cartes de ${target.pseudo}: ${shown}`);
        }
        break;
      case "DETECTIVE":
        if (target && target.hand.length > 0) {
          const c = target.hand[Math.floor(Math.random() * target.hand.length)];
          messages.push(`→ 🕵️ voit: ${c.name}`);
        }
        break;
      case "XRAY":
        if (target) {
          const n = target.hand.filter(c => c.type === "special").length;
          messages.push(`→ 📡 ${target.pseudo} a ${n} carte(s) spéciale(s)`);
        }
        break;

      case "THIEF":
        if (target && target.hand.length > 0) {
          if (this.isProtected(target, "steal", "THIEF")) {
            messages.push(`→ ${target.pseudo} est protégé!`);
          } else {
            const idx = Math.floor(Math.random() * target.hand.length);
            caster.hand.push(...target.hand.splice(idx, 1));
            messages.push(`→ 🥷 vole une carte à ${target.pseudo}`);
          }
        }
        break;

      case "PICKPOCKET":
        if (target && target.hand.length > 0) {
          if (this.isProtected(target, "steal", "PICKPOCKET")) {
            messages.push(`→ ${target.pseudo} est protégé!`);
          } else {
            shared.pickpocket = {
              casterId: playerId,
              targetId,
              cards: target.hand.map((c, i) => ({ index: i, id: c.id, name: c.name, img: c.img })),
            };
            messages.push(`→ 🥷 ${caster.pseudo} regarde la main de ${target.pseudo} — choisis une carte`);
          }
        }
        break;

      case "MYSTERY_HAND":
        this.swapRandomToRight(game);
        messages.push("→ 🥷 chacun donne une carte à son voisin de droite");
        break;

      case "BLACK_MARKET":
        if (target && target.hand.length > 0 && caster.hand.length > 0) {
          const mi = Math.floor(Math.random() * caster.hand.length);
          const ti = Math.floor(Math.random() * target.hand.length);
          [caster.hand[mi], target.hand[ti]] = [target.hand[ti], caster.hand[mi]];
          messages.push(`→ 🥷 échange une carte avec ${target.pseudo}`);
        }
        break;

      case "FULL_SWAP":
        if (target) {
          [caster.hand, target.hand] = [[...target.hand], [...caster.hand]];
          messages.push(`→ 🥷 échange ENTIÈREMENT sa main avec ${target.pseudo}`);
        }
        break;

      case "REVERSE":
        game.gameDirection = (game.gameDirection || 1) * -1;
        messages.push("→ ↩️ inverse le sens du jeu!");
        break;

      case "SKIP":
        if (!opts?.deferAttack) {
          const skipAtk = this.getAttackDescriptor(card, targetId, game);
          this.applyAttack(game, shared, skipAtk, targetId, playerId, messages);
        }
        break;

      case "FREEZE":
        target.frozen = true;
        messages.push(`→ ❄️ ${target.pseudo} est gelé (perd son prochain tour, non contrable)`);
        break;

      case "ALL_DRAW":
        game.playerOrder.forEach(id => this.drawCard(game, id));
        messages.push("→ tous les joueurs piochent 1 carte");
        break;

      case "RUSSIAN_ROULETTE":
        if (Math.random() < 0.5) {
          this.applyDrinks(game, shared, playerId, 4, playerId, "malus_global", messages, { cardId: "RUSSIAN_ROULETTE" });
          messages.push("→ 🎲 tu bois 4 🍺!");
        } else {
          Object.keys(players).filter(id => id !== playerId).forEach(id => {
            this.applyDrinks(game, shared, id, 4, playerId, "malus_global", messages, { cardId: "RUSSIAN_ROULETTE" });
          });
          messages.push("→ 🎲 tu distribues 4 🍺 à chaque autre joueur!");
        }
        break;

      case "VIRUS": {
        const order = game.playerOrder;
        const dir = game.gameDirection || 1;
        const idx = order.indexOf(targetId);
        const leftId = order[(idx - dir + order.length) % order.length];
        const rightId = order[(idx + dir) % order.length];
        this.applyDrinks(game, shared, leftId, 2, playerId, "malus_target", messages, { cardId: "VIRUS" });
        this.applyDrinks(game, shared, rightId, 2, playerId, "malus_target", messages, { cardId: "VIRUS" });
        messages.push(`→ 🦠 virus autour de ${target.pseudo}`);
        break;
      }

      case "POISON_GIFT":
        if (target && caster.hand.length > 0) {
          const idx = Math.floor(Math.random() * caster.hand.length);
          target.hand.push(...caster.hand.splice(idx, 1));
          messages.push(`→ ☠️ donne une carte à ${target.pseudo}`);
        }
        break;

      case "PANIC":
        this.swapRandomWithNeighbor(game, game.gameDirection || 1);
        messages.push("→ 😱 panique! échange aléatoire avec le voisin");
        break;
    }

    return messages.join("\n");
  }

  static needsTarget(cardId) {
    return [
      "GIVE_2", "GIVE_3", "GIVE_5", "GIFT", "ALLIANCE", "PROTECTION",
      "PLUS2", "PLUS3", "PLUS5", "DOUBLE_PENALTY", "RELENTLESS", "PUBLIC_ENEMY",
      "THIEF", "PICKPOCKET", "BLACK_MARKET", "FULL_SWAP",
      "SPY", "DETECTIVE", "XRAY", "SKIP", "FREEZE", "VIRUS", "POISON_GIFT",
    ].includes(cardId);
  }

  static canTargetSelf(cardId) {
    return cardId === "PROTECTION";
  }

  static hasBlockingAction(shared) {
    return !!(shared?.pickpocket || shared?.pendingReaction);
  }

  static getEndgameLoser(game) {
    if (!game?.started || (game.deck?.length ?? 0) > 0) return null;

    const shared = game.sharedState || {};
    if (Effects.hasBlockingAction(shared)) return null;

    const entries = Object.entries(game.players || {});
    const withCards = entries.filter(([, p]) => (p.hand?.length || 0) > 0);

    if (withCards.length !== 1) return null;

    const [loserId, loser] = withCards[0];
    if (loser.hand.length !== 1 || loser.hand[0].id !== "DIABLE_NOIR") return null;

    const othersEmpty = entries.every(([id, p]) =>
      id === loserId || (p.hand?.length || 0) === 0
    );
    if (!othersEmpty) return null;

    return loserId;
  }

  static handNeedsTargetPick(hand) {
    return hand.some(c => this.needsTarget(c.id) && !this.isUnplayable(c.id));
  }

  static validateTarget(card, targetId, game, playerId) {
    if (!this.needsTarget(card.id)) return { ok: true };

    if (!targetId || !game.players[targetId]) {
      return { ok: false, msg: "Choisis une cible dans le cercle avant de jouer cette carte" };
    }
    if (targetId === playerId && !this.canTargetSelf(card.id)) {
      return { ok: false, msg: "Tu ne peux pas te cibler toi-même avec cette carte" };
    }

    const target = game.players[targetId];
    const myHand = game.players[playerId]?.hand || [];

    switch (card.id) {
      case "THIEF":
      case "PICKPOCKET":
      case "DETECTIVE":
        if (target.hand.length === 0) {
          return { ok: false, msg: `${target.pseudo} n'a aucune carte en main` };
        }
        break;
      case "BLACK_MARKET":
        if (target.hand.length === 0) {
          return { ok: false, msg: `${target.pseudo} n'a aucune carte à échanger` };
        }
        if (myHand.length < 2) {
          return { ok: false, msg: "Il te faut au moins une autre carte en main pour échanger" };
        }
        break;
      case "POISON_GIFT":
        if (myHand.length < 2) {
          return { ok: false, msg: "Il te faut une autre carte en main à donner" };
        }
        break;
    }
    return { ok: true };
  }

  static getTargetHint(cardId) {
    const hints = {
      GIVE_2: "1 joueur boit 2 🍺", GIVE_3: "1 joueur boit 3 🍺", GIVE_5: "1 joueur boit 5 🍺",
      PLUS2: "1 joueur boit +2 🍺", PLUS3: "1 joueur boit +3 🍺", PLUS5: "1 joueur boit +5 🍺",
      GIFT: "1 joueur pioche 2 cartes", ALLIANCE: "1 coéquipier", PROTECTION: "1 joueur (toi inclus)",
      DOUBLE_PENALTY: "1 joueur — malus différé", RELENTLESS: "1 joueur — acharnement",
      PUBLIC_ENEMY: "1 joueur — Ennemi Public", THIEF: "1 joueur — vole une carte",
      PICKPOCKET: "1 joueur — choisis la carte volée", BLACK_MARKET: "1 joueur — échange aléatoire",
      FULL_SWAP: "1 joueur — échange de mains", SPY: "1 joueur — voir 2 cartes",
      DETECTIVE: "1 joueur — 1 carte aléatoire", XRAY: "1 joueur — compter spéciales",
      SKIP: "1 joueur — passe son tour", FREEZE: "1 joueur — gelé (non contrable)",
      VIRUS: "1 joueur au centre — ses voisins boivent", POISON_GIFT: "1 joueur — lui donner une carte",
    };
    return hints[cardId] || "1 joueur dans le cercle";
  }

  static blocksTurnAdvance(cardId, shared) {
    if (shared.pendingReaction) return true;
    if (cardId === "PICKPOCKET" && shared.pickpocket) return true;
    return false;
  }
}

class GameController {
  constructor() {
    this.playerId = Math.random().toString(36).substring(2, 11);
    this.room = "main";
    this.selectedTarget = null;
    this.setupListeners();
  }

  roomRef() {
    return db.ref(`rooms/${this.room}`);
  }

  setupListeners() {
    document.getElementById("pseudo").addEventListener("keypress", (e) => {
      if (e.key === "Enter") this.join();
    });
  }

  join() {
    const pseudo = document.getElementById("pseudo").value.trim();
    if (!pseudo) return alert("Entre un pseudo");

    if (!db) {
      return alert(FirebaseSetup.errorMessage || "Firebase non initialisé.");
    }
    if (!FirebaseSetup.ready) {
      return alert("Firebase pas encore connecté. Attendez le message vert ou corrigez la configuration.");
    }

    const joinBtn = document.getElementById("joinBtn");
    joinBtn.disabled = true;
    FirebaseSetup.setStatus("loading", "Connexion en cours…");

    this.roomRef().once("value")
      .then((snapshot) => {
        const game = snapshot.val();
        if (game?.sharedState?.finished) {
          throw new Error("FINISHED");
        }
        if (game?.started) {
          throw new Error("STARTED");
        }
        return this.roomRef().child(`players/${this.playerId}`).set(defaultPlayer(pseudo));
      })
      .then(() => {
        document.body.classList.add("in-game");
        document.getElementById("game").classList.remove("hidden");
        document.getElementById("quitBtn").classList.remove("hidden");
        document.getElementById("forcePassBtn").classList.remove("hidden");
        document.getElementById("handHud").classList.remove("hidden");
        FirebaseSetup.setStatus("ok", `✅ Connecté en tant que ${pseudo} — en attente du démarrage`);
        this.listenGame();
      })
      .catch((err) => {
        joinBtn.disabled = false;
        if (err.message === "FINISHED") {
          FirebaseSetup.setStatus("error", "Partie terminée — le premier joueur doit cliquer Recommencer, ou supprimez la salle dans Firebase.");
          return alert("❌ Partie terminée — demandez un reset ou supprimez rooms/main dans Firebase Console.");
        }
        if (err.message === "STARTED") {
          FirebaseSetup.setStatus("error", "Une partie est déjà en cours dans rooms/main.");
          return alert("❌ Partie déjà en cours.\n\nUn autre joueur doit cliquer « Recommencer », ou supprimez rooms/main dans Firebase Console → Realtime Database.");
        }
        const msg = FirebaseSetup.formatError(err);
        FirebaseSetup.setStatus("error", msg.replace(/\n/g, "<br>"));
        alert("Erreur Firebase:\n\n" + msg);
      });
  }

  start() {
    this.roomRef().transaction((game) => {
      if (!game?.players) return;
      const playerIds = Object.keys(game.players);
      if (playerIds[0] !== this.playerId) return;

      const deck = Deck.create();
      playerIds.forEach((id) => {
        game.players[id].hand = [];
        for (let i = 0; i < 5; i++) game.players[id].hand.push(deck.pop());
      });

      game.deck = deck;
      game.deckInitialSize = deck.length;
      game.playerOrder = playerIds;
      game.currentPlayerIndex = 0;
      game.gameDirection = 1;
      game.started = true;
      game.message = "🔥 La partie commence!";
      game.sharedState = defaultSharedState();
      return game;
    });
  }

  onTurnStart(game, playerId, shared, turnMessages) {
    const player = game.players[playerId];

    if (player.enemyOfPublic) {
      player.enemyOfPublic = false;
      turnMessages.push(`👿 Ennemi Public de ${player.pseudo} expire`);
    }

    if (player.alliance) {
      const partnerId = player.alliance;
      player.alliance = null;
      if (game.players[partnerId]) game.players[partnerId].alliance = null;
      turnMessages.push(`🤝 Alliance de ${player.pseudo} expire`);
    }

    if (player.protection) {
      player.protection = false;
      turnMessages.push(`🔰 Protection de ${player.pseudo} expire`);
    }

    if (player.delayedDrinks > 0) {
      const d = player.delayedDrinks;
      player.delayedDrinks = 0;
      player.drinks = (player.drinks || 0) + d;
      turnMessages.push(`⏳ ${player.pseudo} boit ${d} 🍺 (Double Peine)`);
    }

    if (Effects.hasCurseInHand(player)) {
      player.drinks = (player.drinks || 0) + 1;
      turnMessages.push(`☠️ ${player.pseudo} boit 1 🍺 (Malédiction en main)`);
    }

    if (shared.bombActive) {
      shared.bombActive = false;
      player.drinks = (player.drinks || 0) + 5;
      turnMessages.push(`💣 ${player.pseudo} boit 5 🍺 (Bombe)!`);
    }
  }

  advanceTurn(game, shared) {
    const order = game.playerOrder;
    const direction = game.gameDirection || 1;
    const turnMessages = [];
    let idx = game.currentPlayerIndex;
    let steps = 0;

    if (shared.extraTurn) {
      shared.extraTurn = false;
      return { index: idx, messages: turnMessages };
    }

    do {
      idx = (idx + direction + order.length) % order.length;
      steps++;
      if (steps > order.length * 2) break;

      const player = game.players[order[idx]];

      if (player.frozen) {
        player.frozen = false;
        turnMessages.push(`❄️ ${player.pseudo} perd son tour (Gel)`);
        continue;
      }

      if (player.skip) {
        player.skip = false;
        turnMessages.push(`⏭️ ${player.pseudo} passe son tour`);
        continue;
      }

      break;
    } while (true);

    this.onTurnStart(game, order[idx], shared, turnMessages);
    return { index: idx, messages: turnMessages };
  }

  playCard(index) {
    const targetId = this.selectedTarget;

    this.roomRef().once("value").then((snapshot) => {
      const game = snapshot.val();
      if (!game?.started) return;
      if (game.sharedState?.finished) return alert("Partie terminée");

      const order = game.playerOrder;
      if (order[game.currentPlayerIndex] !== this.playerId) return alert("Pas ton tour");

      const shared = game.sharedState || defaultSharedState();
      if (Effects.hasBlockingAction(shared)) {
        return alert("Termine l'action en cours d'abord");
      }

      const hand = game.players[this.playerId]?.hand || [];
      const card = hand[index];
      if (!card) return;
      if (Effects.isUnplayable(card.id)) return alert(`❌ Tu ne peux pas jouer ${card.name}`);

      const validation = Effects.validateTarget(card, targetId, game, this.playerId);
      if (!validation.ok) return alert(validation.msg);

      this.roomRef().transaction((g) => {
        if (!g?.started || g.sharedState?.finished) return;
        const s = g.sharedState || defaultSharedState();
        if (s.pickpocket || s.pendingReaction) return;

        const currentId = g.playerOrder[g.currentPlayerIndex];
        if (currentId !== this.playerId) return;

        const playerHand = g.players[this.playerId].hand;
        const played = playerHand[index];
        if (!played || Effects.isUnplayable(played.id)) return;

        const playValidation = Effects.validateTarget(played, targetId, g, this.playerId);
        if (!playValidation.ok) return;

        playerHand.splice(index, 1);

        g.lastPlay = {
          playerId: this.playerId,
          card: { id: played.id, name: played.name, type: played.type, img: played.img },
          ts: Date.now(),
        };

        const bonusMsgs = [];
        let attack = targetId ? Effects.getAttackDescriptor(played, targetId, g) : null;

        if (attack) {
          const shieldMsgs = [];
          if (Effects.tryAutoShield(g, targetId, attack, shieldMsgs)) {
            if (Effects.isPlusGiveCard(played.id)) {
              Effects.prepareDrinkAttack(played, targetId, g, this.playerId, bonusMsgs);
            }
            const partialMsg = Effects.apply(g, this.playerId, played, targetId, s, { deferAttack: true });
            let fullMsg = partialMsg;
            if (bonusMsgs.length) fullMsg += "\n" + bonusMsgs.join("\n");
            fullMsg += "\n" + shieldMsgs.join("\n");
            const blocksAdvance = Effects.blocksTurnAdvance(played.id, s);
            if (!blocksAdvance) {
              this.drawCardAfterPlay(g, this.playerId);
              if (!s.extraTurn) {
                const result = this.advanceTurn(g, s);
                g.currentPlayerIndex = result.index;
                if (result.messages.length) fullMsg = result.messages.join("\n") + "\n" + fullMsg;
              }
            }
            g.message = fullMsg;
            g.sharedState = s;
            this.checkWinCondition(g);
            return g;
          }
        }

        const previewAttack = attack && Effects.isPlusGiveCard(played.id) && g.players[this.playerId]?.doubleDistBonus
          ? { ...attack, amount: attack.amount + 2 }
          : attack;
        const needsReaction = previewAttack && Effects.shouldOfferReaction(g, played, targetId, previewAttack);

        if (needsReaction) {
          const reactionAttack = Effects.isPlusGiveCard(played.id)
            ? Effects.prepareDrinkAttack(played, targetId, g, this.playerId, bonusMsgs)
            : attack;
          s.pendingReaction = {
            casterId: this.playerId,
            targetId,
            attack: reactionAttack,
            sourceCard: { id: played.id, name: played.name },
          };
          const partialMsg = Effects.apply(g, this.playerId, played, targetId, s, { deferAttack: true });
          let fullMsg = partialMsg;
          if (bonusMsgs.length) fullMsg += "\n" + bonusMsgs.join("\n");
          fullMsg += `\n⚔️ ${g.players[targetId].pseudo}, tu es visé! Joue Miroir, Protection ou Retour de Flamme.`;
          g.message = fullMsg;
          g.sharedState = s;
          return g;
        }

        const effectMsg = Effects.apply(g, this.playerId, played, targetId, s);
        let fullMsg = effectMsg;

        const blocksAdvance = Effects.blocksTurnAdvance(played.id, s);
        if (!blocksAdvance) this.drawCardAfterPlay(g, this.playerId);

        let nextIndex = g.currentPlayerIndex;

        if (!blocksAdvance) {
          const result = this.advanceTurn(g, s);
          nextIndex = result.index;
          if (result.messages.length) fullMsg = result.messages.join("\n") + "\n" + fullMsg;
        }

        g.currentPlayerIndex = nextIndex;
        g.message = fullMsg;
        g.sharedState = s;
        this.checkWinCondition(g);
        return g;
      }).then((result) => {
        if (result.committed) this.selectedTarget = null;
      });
    });
  }

  drawCardAfterPlay(game, playerId) {
    if (game.deck.length > 0) {
      game.players[playerId].hand.push(game.deck.pop());
    }
  }

  clearBlockingActions(shared) {
    shared.pendingReaction = null;
    shared.tribunal = null;
    shared.pickpocket = null;
    shared.extraTurn = false;
  }

  forcePassTurn() {
    this.roomRef().once("value").then((snapshot) => {
      const game = snapshot.val();
      if (!game?.started) return alert("La partie n'a pas encore commencé.");
      if (game.sharedState?.finished) return alert("Partie terminée.");

      const order = game.playerOrder || Object.keys(game.players || {});
      if (order[game.currentPlayerIndex] !== this.playerId) {
        return alert("Ce n'est pas ton tour — seul le joueur actif peut utiliser ce bouton.");
      }

      if (!confirm(
        "Passer ton tour de force (anti-bug) ?\n\n" +
        "• Annule toute action en cours (Tribunal, Pickpocket, contre…)\n" +
        "• Passe au joueur suivant\n" +
        "• Tu pioches 1 carte bonus"
      )) return;

      this.selectedTarget = null;

      this.roomRef().transaction((g) => {
        if (!g?.started) return;

        const shared = g.sharedState || defaultSharedState();
        if (shared.finished) return;

        const ord = g.playerOrder || Object.keys(g.players || {});
        if (ord[g.currentPlayerIndex] !== this.playerId) return;

        const passer = g.players[this.playerId];
        if (!passer) return;

        this.clearBlockingActions(shared);
        this.drawCardAfterPlay(g, this.playerId);

        const result = this.advanceTurn(g, shared);
        g.currentPlayerIndex = result.index;

        let msg = `⏭️ ${passer.pseudo} passe son tour (anti-bug) — action annulée, +1 carte bonus.`;
        if (result.messages.length) msg = result.messages.join("\n") + "\n" + msg;

        g.message = msg;
        g.sharedState = shared;
        this.checkWinCondition(g);
        return g;
      });
    });
  }

  finishPlayAfterReaction(game, shared, casterId, reactionMsg, sourceCard) {
    this.drawCardAfterPlay(game, casterId);

    let fullMsg = reactionMsg;
    let nextIndex = game.currentPlayerIndex;

    if (!shared.extraTurn) {
      const result = this.advanceTurn(game, shared);
      nextIndex = result.index;
      if (result.messages.length) fullMsg = result.messages.join("\n") + "\n" + fullMsg;
    }

    game.currentPlayerIndex = nextIndex;
    game.message = fullMsg;
    this.checkWinCondition(game);
  }

  playReaction(handIndex) {
    this.roomRef().transaction((g) => {
      if (!g?.started) return;
      const s = g.sharedState || defaultSharedState();
      const pr = s.pendingReaction;
      if (!pr || pr.targetId !== this.playerId) return;

      const casterId = pr.casterId;
      const sourceCard = pr.sourceCard;

      const reactionMsg = Effects.resolveReaction(g, s, handIndex);
      if (!reactionMsg) return;

      this.finishPlayAfterReaction(g, s, casterId, reactionMsg, sourceCard);
      g.sharedState = s;
      return g;
    });
  }

  declineReaction() {
    this.playReaction(null);
  }

  toggleTarget(targetId, game) {
    const shared = game.sharedState || defaultSharedState();
    if (Effects.hasBlockingAction(shared)) return;

    const order = game.playerOrder || Object.keys(game.players || {});
    if (order[game.currentPlayerIndex] !== this.playerId) return;

    this.selectedTarget = this.selectedTarget === targetId ? null : targetId;
    this.renderFromGame(game);
  }

  selectTarget(targetId) {
    this.roomRef().once("value").then((snapshot) => {
      const game = snapshot.val();
      if (game) this.toggleTarget(targetId, game);
    });
  }

  pickpocketSteal(cardIndex) {
    this.roomRef().transaction((game) => {
      const shared = game.sharedState;
      const pp = shared?.pickpocket;
      if (!pp || pp.casterId !== this.playerId) return;

      const caster = game.players[pp.casterId];
      const target = game.players[pp.targetId];
      if (cardIndex < 0 || cardIndex >= target.hand.length) return;

      caster.hand.push(...target.hand.splice(cardIndex, 1));
      shared.pickpocket = null;

      this.drawCardAfterPlay(game, pp.casterId);
      const result = this.advanceTurn(game, shared);
      game.currentPlayerIndex = result.index;
      game.message = `🥷 ${caster.pseudo} vole une carte à ${target.pseudo}`;
      if (result.messages.length) game.message = result.messages.join("\n") + "\n" + game.message;
      this.checkWinCondition(game);
      return game;
    });
  }

  checkWinCondition(game) {
    const shared = game.sharedState || defaultSharedState();
    if (shared.finished) return;

    const loserId = Effects.getEndgameLoser(game);
    if (!loserId) return;

    const loser = game.players[loserId];
    shared.finished = true;
    shared.loserId = loserId;
    game.message = `🍺 FIN DE PARTIE — CUL SEC pour ${loser.pseudo} ! (Diable Noir 😈)`;
  }

  renderGameEndOverlay(game, shared, players) {
    const overlay = document.getElementById("gameEndOverlay");
    if (!overlay) return;

    if (!shared.finished || !shared.loserId) {
      overlay.classList.add("hidden");
      overlay.classList.remove("game-end-overlay--win", "game-end-overlay--lose");
      return;
    }

    const loser = players[shared.loserId];
    const iLost = shared.loserId === this.playerId;
    const winnerCount = Object.keys(players).length - 1;

    overlay.classList.remove("hidden");
    overlay.classList.toggle("game-end-overlay--lose", iLost);
    overlay.classList.toggle("game-end-overlay--win", !iLost);

    document.getElementById("gameEndEmoji").textContent = iLost ? "😈🍺" : "🏆";
    document.getElementById("gameEndTitle").textContent = iLost ? "CUL SEC !" : "VICTOIRE !";
    document.getElementById("gameEndText").textContent = iLost
      ? "Tu es le seul resté avec le Diable Noir…"
      : `${loser?.pseudo || "?"} boit cul sec avec le Diable Noir !`;
    document.getElementById("gameEndSub").textContent = iLost
      ? "Pioche vide · une seule carte en jeu · c'était le Diable Noir."
      : `Pioche vide · ${winnerCount} gagnant${winnerCount > 1 ? "s" : ""} · fin de partie.`;
  }

  listenGame() {
    this.roomRef().on("value", (snapshot) => {
      if (snapshot.exists()) this.renderFromGame(snapshot.val());
    });
  }

  renderFromGame(game) {
    if (!game) return;

    const players = game.players || {};
    const order = game.playerOrder || Object.keys(players);
    const shared = game.sharedState || defaultSharedState();
    const myHand = players[this.playerId]?.hand || [];
    const isMyTurn = game.started && order[game.currentPlayerIndex] === this.playerId;
    const blocking = Effects.hasBlockingAction(shared);

    if (!isMyTurn || blocking) this.selectedTarget = null;

    document.body.classList.toggle("game-started", !!game.started);

    const handFeed = document.getElementById("handFeed");
    if (handFeed) handFeed.classList.toggle("hidden", !game.started);

    const center = document.getElementById("center");
    if (!game.started) {
      center.textContent = `⏳ En attente... (${order.length} joueur${order.length > 1 ? "s" : ""})`;
      document.getElementById("startBtn").classList.toggle("hidden", this.playerId !== order[0]);
    } else if (shared.finished && shared.loserId) {
      const loser = players[shared.loserId];
      center.textContent = shared.loserId === this.playerId
        ? "😈 CUL SEC — Diable Noir"
        : `🏆 Victoire — ${loser?.pseudo} cul sec`;
      document.getElementById("startBtn").classList.add("hidden");
    } else {
      const currentId = order[game.currentPlayerIndex];
      const pr = shared.pendingReaction;
      if (pr?.targetId === this.playerId) {
        center.textContent = "⚔️ Contre — choisis une carte";
      } else if (pr) {
        center.textContent = `⏳ ${players[pr.targetId]?.pseudo} répond…`;
      } else if (shared.pickpocket?.casterId === this.playerId) {
        center.textContent = "🥷 Pickpocket";
      } else if (isMyTurn) {
        center.textContent = "🎮 Ton tour";
      } else {
        center.textContent = `🎮 ${players[currentId]?.pseudo}`;
      }
      document.getElementById("startBtn").classList.add("hidden");
    }

    this.renderGameEndOverlay(game, shared, players);

    document.getElementById("message").textContent = game.message || "";
    const feedEl = document.getElementById("handFeed");
    if (feedEl && game.message) feedEl.scrollTop = feedEl.scrollHeight;

    const deckSize = game.deck?.length ?? 0;
    let deckInitial = game.deckInitialSize;
    if (!deckInitial && game.started) {
      deckInitial = deckSize + order.reduce((n, id) => n + (players[id]?.hand?.length || 0), 0);
    }
    TableFX.updateDeck(deckSize, deckInitial, game.started);

    const circle = document.getElementById("circle");
    const playersLayer = document.getElementById("playersLayer") || circle;
    playersLayer.innerHTML = "";
    const size = circle.offsetWidth || 400;
    const cx = size / 2;
    const cy = size / 2;
    const radius = size / 2 - 55;

    const canPickTarget = isMyTurn && !shared.finished && !blocking;
    const currentId = game.started ? order[game.currentPlayerIndex] : null;

    order.forEach((id, idx) => {
      const player = players[id];
      if (!player) return;

      const angle = (idx / order.length) * 2 * Math.PI - Math.PI / 2;
      const el = document.createElement("div");
      el.className = "player";
      el.dataset.playerId = id;
      if (id === currentId) el.classList.add("current-turn");
      if (shared.finished && id === shared.loserId) el.classList.add("loser-final");
      if (id === this.selectedTarget) el.classList.add("selected");
      if (player.skip) el.classList.add("skipped");
      if (player.frozen) el.classList.add("frozen");
      if (player.shieldActive) el.classList.add("protected");
      if (player.enemyOfPublic) el.classList.add("enemy");

      el.style.left = `${cx + radius * Math.cos(angle)}px`;
      el.style.top = `${cy + radius * Math.sin(angle)}px`;

      let status = `${player.hand.length} cartes · ${player.drinks || 0} 🍺`;
      const badges = Effects.getPlayerBadges(player);

      el.innerHTML = `
        <div class="player-name">${player.pseudo}${id === this.playerId ? " (toi)" : ""}</div>
        <div class="player-badges">${badges || "—"}</div>
        <div class="player-status">${status}</div>
      `;

      if (canPickTarget) {
        el.classList.add("clickable");
        el.onclick = () => this.toggleTarget(id, game);
      }
      playersLayer.appendChild(el);
    });

    TableFX.handleLastPlay(game, this.playerId);
    TableFX.syncDrawState(game, myHand.length, this.playerId);

    const handEl = document.getElementById("hand");
    handEl.innerHTML = "";
    const isTargeted = shared.pendingReaction?.targetId === this.playerId;
    const counterIndices = isTargeted
      ? Effects.getAvailableCounters(myHand, shared.pendingReaction.attack).map(c => c.index)
      : [];

    myHand.forEach((card, idx) => {
      const el = document.createElement("div");
      el.className = "card";
      if (card.id === "DIABLE_NOIR" || card.id === "CURSE") el.classList.add("diable-noir");
      if (card.id === "CURSE") el.classList.add("curse-card");

      const isCounterPick = isTargeted && counterIndices.includes(idx);
      if (isCounterPick && !shared.finished) {
        el.classList.add("counter-pick");
        el.onclick = () => this.playReaction(idx);
      } else if (isMyTurn && !blocking && !shared.finished) {
        if (Effects.isUnplayable(card.id)) {
          el.classList.add("disabled");
        } else if (Effects.needsTarget(card.id) && !this.selectedTarget) {
          el.classList.add("disabled", "needs-target");
          el.title = `${card.name} — choisis d'abord une cible (${Effects.getTargetHint(card.id)})`;
        } else {
          const v = Effects.validateTarget(card, this.selectedTarget, game, this.playerId);
          if (!v.ok) {
            el.classList.add("disabled");
            el.title = v.msg;
          } else {
            el.onclick = () => {
              TableFX.animatePlayFromHand(
                el,
                card,
                players[this.playerId]?.pseudo,
                () => this.playCard(idx)
              );
            };
            el.title = card.name;
          }
        }
      } else {
        el.classList.add("disabled");
      }

      el.innerHTML = "";
      CardVisuals.fillCardElement(el, card);
      handEl.appendChild(el);
    });

    this.renderActionUI(game, shared, myHand, counterIndices, isTargeted, isMyTurn);
  }

  renderActionUI(game, shared, myHand, counterIndices, isTargeted, isMyTurn) {
    const banner = document.getElementById("actionBanner");
    const reactionPanel = document.getElementById("reactionPanel");
    const pickpocketPanel = document.getElementById("pickpocketPanel");
    const reactionCards = document.getElementById("reactionCards");
    const pickpocketCards = document.getElementById("pickpocketCards");

    banner.classList.add("hidden");
    reactionPanel.classList.add("hidden");
    pickpocketPanel.classList.add("hidden");
    reactionCards.innerHTML = "";
    pickpocketCards.innerHTML = "";

    if (shared.finished) {
      document.body.classList.toggle("panel-open", false);
      document.body.classList.toggle("banner-open", false);
      return;
    }

    let bannerOpen = false;
    let panelOpen = false;

    if (isTargeted && shared.pendingReaction) {
      panelOpen = true;
      const pr = shared.pendingReaction;
      const attack = pr.attack;
      reactionPanel.classList.remove("hidden");
      document.getElementById("reactionText").textContent =
        `${game.players[pr.casterId].pseudo} joue ${attack.cardName} contre toi` +
        (attack.kind === "drinks" ? ` (${attack.amount} 🍺)` : "") +
        (attack.kind === "skip" ? " — passe ton tour" : "") +
        ". Clique une carte :";

      counterIndices.forEach((idx) => {
        const card = myHand[idx];
        const el = document.createElement("div");
        el.className = "card counter-pick";
        CardVisuals.fillCardElement(el, card);
        el.onclick = () => this.playReaction(idx);
        reactionCards.appendChild(el);
      });
    }

    if (isMyTurn && !Effects.hasBlockingAction(shared) && game.players[this.playerId]?.doubleDistBonus) {
      banner.classList.remove("hidden");
      bannerOpen = true;
      document.getElementById("bannerTitle").textContent = "👥 Double Dist.";
      document.getElementById("bannerText").textContent = "Prochaine Donne/+X : +2 🍺.";
    }

    if (isMyTurn && !Effects.hasBlockingAction(shared) && Effects.handNeedsTargetPick(myHand)) {
      banner.classList.remove("hidden");
      bannerOpen = true;
      if (this.selectedTarget) {
        const name = game.players[this.selectedTarget]?.pseudo || "?";
        document.getElementById("bannerTitle").textContent = `🎯 ${name}`;
        document.getElementById("bannerText").textContent = "Joue une carte de ta main.";
      } else {
        document.getElementById("bannerTitle").textContent = "🎯 Choisis une cible";
        document.getElementById("bannerText").textContent = "Tape un joueur sur le cercle.";
      }
    }

    if (shared.pickpocket?.casterId === this.playerId) {
      panelOpen = true;
      pickpocketPanel.classList.remove("hidden");
      const target = game.players[shared.pickpocket.targetId];
      document.getElementById("pickpocketText").textContent =
        `Main de ${target.pseudo} — choisis une carte à voler :`;
      target.hand.forEach((card, idx) => {
        const el = document.createElement("div");
        el.className = "card";
        CardVisuals.fillCardElement(el, card);
        el.onclick = () => this.pickpocketSteal(idx);
        pickpocketCards.appendChild(el);
      });
    }

    document.body.classList.toggle("panel-open", panelOpen);
    document.body.classList.toggle("banner-open", bannerOpen);
  }

  quitAndReset() {
    if (!confirm("Quitter la partie ?\n\nLa salle Firebase sera supprimée. Tu devras re-entrer ton pseudo.")) return;
    if (this.roomRef) {
      this.roomRef().off();
      this.roomRef().remove().finally(() => location.reload()).catch(() => location.reload());
    } else {
      location.reload();
    }
  }

  reset() {
    this.quitAndReset();
  }
}

const gameController = db
  ? new GameController()
  : {
      join() { alert(FirebaseSetup.errorMessage || "Firebase non configuré."); },
      quitAndReset() { location.reload(); },
      forcePassTurn() {},
      declineReaction() {},
    };
</script>
