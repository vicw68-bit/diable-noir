<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>😈 Diable Noir - Jeu de Cartes</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f0f0f;
      color: white;
      font-family: 'Arial', sans-serif;
      text-align: center;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    h1 {
      color: #ff3333;
      font-size: 3em;
      margin-bottom: 20px;
      text-shadow: 0 0 10px rgba(255, 51, 51, 0.5);
    }

    .screen {
      width: 100%;
      max-width: 1200px;
      transition: opacity 0.3s;
    }

    .screen.hidden {
      display: none;
    }

    /* LOGIN */
    #login {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .login-container {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    input {
      padding: 12px 15px;
      border: 2px solid #ff3333;
      border-radius: 5px;
      background: #1a1a1a;
      color: white;
      font-size: 1em;
      min-width: 200px;
    }

    input:focus {
      outline: none;
      box-shadow: 0 0 10px rgba(255, 51, 51, 0.5);
    }

    button {
      padding: 12px 20px;
      background: #ff3333;
      border: none;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1em;
      transition: all 0.2s;
    }

    button:hover:not(:disabled) {
      background: #ff5555;
      transform: scale(1.05);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button.hidden {
      display: none;
    }

    /* GAME */
    .game-container {
      width: 100%;
      padding: 20px;
    }

    .top-section {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    #resetBtn {
      background: #444;
    }

    #resetBtn:hover {
      background: #666;
    }

    #startBtn {
      background: #00aa00;
    }

    #startBtn:hover {
      background: #00dd00;
    }

    .center-info {
      font-size: 1.5em;
      color: #00ffcc;
      margin: 20px 0;
      min-height: 30px;
    }

    .message {
      color: #00ffcc;
      margin: 10px 0;
      font-size: 0.95em;
      min-height: 20px;
    }

    /* CERCLE DE JOUEURS */
    .circle {
      position: relative;
      width: 400px;
      height: 400px;
      margin: 30px auto;
      border: 2px solid #ff3333;
      border-radius: 50%;
    }

    .player {
      position: absolute;
      background: linear-gradient(135deg, #222, #333);
      padding: 12px;
      border-radius: 10px;
      border: 2px solid #ff3333;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 100px;
      text-align: center;
    }

    .player:hover {
      transform: scale(1.1);
      background: linear-gradient(135deg, #333, #444);
      box-shadow: 0 0 15px rgba(255, 51, 51, 0.7);
    }

    .player.selected {
      background: linear-gradient(135deg, #ff3333, #ff5555);
      box-shadow: 0 0 20px rgba(255, 51, 51, 0.9);
    }

    .player.skipped {
      opacity: 0.5;
      border-color: #ffaa00;
      background: linear-gradient(135deg, #333, #222);
    }

    .player.frozen {
      opacity: 0.6;
      border-color: #00ccff;
      background: linear-gradient(135deg, #1a3a4a, #1a4a5a);
    }

    .player-name {
      font-weight: bold;
      color: white;
    }

    .player-status {
      font-size: 0.8em;
      color: #aaa;
      margin-top: 5px;
    }

    .player-status.protected {
      color: #00ff00;
    }

    .player-status.frozen {
      color: #00ccff;
    }

    /* MAIN */
    .hand {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 15, 15, 0.95);
      border-top: 2px solid #ff3333;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 10px;
      flex-wrap: wrap;
      max-height: 150px;
      overflow-y: auto;
    }

    .card {
      width: 80px;
      height: 120px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .card img {
      width: 100%;
      height: 100%;
      border-radius: 8px;
      border: 2px solid #ff3333;
      object-fit: cover;
    }

    .card:hover {
      transform: translateY(-15px) scale(1.1);
      filter: drop-shadow(0 0 10px rgba(255, 51, 51, 0.7));
    }

    .card.diable-noir img {
      filter: brightness(0.7) saturate(2);
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      h1 {
        font-size: 2em;
      }

      .circle {
        width: 300px;
        height: 300px;
      }

      .player {
        min-width: 80px;
        padding: 8px;
        font-size: 0.85em;
      }

      .card {
        width: 60px;
        height: 90px;
      }

      .hand {
        max-height: 120px;
      }
    }
  </style>
</head>
<body>

<h1>😈 DIABLE NOIR</h1>

<div id="login" class="screen">
  <div class="login-container">
    <input id="pseudo" placeholder="Pseudo" autocomplete="off">
    <button onclick="gameController.join()">Entrer</button>
  </div>
</div>

<div id="game" class="screen hidden">
  <div class="game-container">
    <div class="top-section">
      <button id="resetBtn" class="hidden" onclick="gameController.reset()">🔄 Recommencer</button>
      <button id="startBtn" class="hidden" onclick="gameController.start()">Démarrer</button>
    </div>

    <div id="center" class="center-info">En attente...</div>
    <div id="message" class="message"></div>
    <div id="circle" class="circle"></div>
    <div id="hand" class="hand"></div>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
// ============================================
// CONFIG FIREBASE
// ============================================
const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "diable-noir.firebaseapp.com",
  databaseURL: "https://diable-noir-default-rtdb.europe-west1.firebasedatabase.app",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ============================================
// CLASSE DECK
// ============================================
class Deck {
  static create() {
    const deck = [];

    // 😈 DIABLE NOIR (unique)
    deck.push({ id: "DIABLE_NOIR", type: "curse", name: "Diable Noir", img: "diable.png" });

    // 🟢 BONUS (22 cartes)
    const bonus = [
      { id: "GIVE_2", name: "Donne 2", img: "give2.png", qty: 5 },
      { id: "GIVE_3", name: "Donne 3", img: "give3.png", qty: 4 },
      { id: "GIVE_5", name: "Donne 5", img: "give5.png", qty: 3 },
      { id: "DOUBLE_DISTRIBUTION", name: "Double Distribution", img: "double_dist.png", qty: 3 },
      { id: "DRAW_2", name: "Pioche 2", img: "draw2.png", qty: 2 },
      { id: "EXTRA_TURN", name: "Deuxième Tour", img: "extra_turn.png", qty: 2 },
      { id: "PROTECTION", name: "Protection Temporaire", img: "protection.png", qty: 1 },
      { id: "GIFT", name: "Cadeau", img: "gift.png", qty: 1 },
      { id: "ALLIANCE", name: "Alliance", img: "alliance.png", qty: 1 }
    ];

    bonus.forEach(card => {
      for (let i = 0; i < card.qty; i++) deck.push({ id: card.id, type: "bonus", name: card.name, img: card.img });
    });

    // 🔴 MALUS CIBLÉS (18 cartes)
    const malusTarget = [
      { id: "PLUS2", name: "Donne +2", img: "plus2.png", qty: 4 },
      { id: "PLUS3", name: "Donne +3", img: "plus3.png", qty: 4 },
      { id: "PLUS5", name: "Donne +5", img: "plus5.png", qty: 3 },
      { id: "DOUBLE_PENALTY", name: "Double Peine", img: "double_penalty.png", qty: 2 },
      { id: "RELENTLESS", name: "Acharnement", img: "relentless.png", qty: 2 },
      { id: "TRIBUNAL", name: "Tribunal", img: "tribunal.png", qty: 2 },
      { id: "PUBLIC_ENEMY", name: "Ennemi Public", img: "public_enemy.png", qty: 1 }
    ];

    malusTarget.forEach(card => {
      for (let i = 0; i < card.qty; i++) deck.push({ id: card.id, type: "malus_target", name: card.name, img: card.img });
    });

    // 🔴 MALUS GÉNÉRAL (12 cartes)
    const malusGlobal = [
      { id: "DRINK_2", name: "Bois 2", img: "drink2.png", qty: 3 },
      { id: "DRINK_3", name: "Bois 3", img: "drink3.png", qty: 3 },
      { id: "DRINK_5", name: "Bois 5", img: "drink5.png", qty: 2 },
      { id: "ALL_EXCEPT_YOU", name: "Tous Sauf Toi", img: "all_except.png", qty: 2 },
      { id: "LEFT", name: "Gauche", img: "left.png", qty: 1 },
      { id: "DISCARD", name: "Défausse", img: "discard.png", qty: 1 }
    ];

    malusGlobal.forEach(card => {
      for (let i = 0; i < card.qty; i++) deck.push({ id: card.id, type: "malus_global", name: card.name, img: card.img });
    });

    // 🟣 CARTES SPÉCIALES (11 cartes)
    const special = [
      { id: "SHIELD", name: "Bouclier", img: "shield.png", qty: 3 },
      { id: "MIRROR", name: "Miroir", img: "mirror.png", qty: 3 },
      { id: "DOUBLE_EFFECT", name: "Double Effet", img: "double_effect.png", qty: 2 },
      { id: "BOMB", name: "Bombe", img: "bomb.png", qty: 1 },
      { id: "BACKFIRE", name: "Retour de Flamme", img: "backfire.png", qty: 2 }
    ];

    special.forEach(card => {
      for (let i = 0; i < card.qty; i++) deck.push({ id: card.id, type: "special", name: card.name, img: card.img });
    });

    // 🕵️ INFO (6 cartes)
    const info = [
      { id: "SPY", name: "Espion", img: "spy.png", qty: 2 },
      { id: "DETECTIVE", name: "Détective", img: "detective.png", qty: 2 },
      { id: "XRAY", name: "Rayon X", img: "xray.png", qty: 2 }
    ];

    info.forEach(card => {
      for (let i = 0; i < card.qty; i++) deck.push({ id: card.id, type: "info", name: card.name, img: card.img });
    });

    // 🥷 VOL / ÉCHANGE (9 cartes)
    const steal = [
      { id: "THIEF", name: "Voleur", img: "thief.png", qty: 3 },
      { id: "PICKPOCKET", name: "Pickpocket", img: "pickpocket.png", qty: 2 },
      { id: "MYSTERY_HAND", name: "Main Mystère", img: "mystery_hand.png", qty: 1 },
      { id: "BLACK_MARKET", name: "Marché Noir", img: "black_market.png", qty: 2 },
      { id: "FULL_SWAP", name: "Échange Total", img: "full_swap.png", qty: 1 }
    ];

    steal.forEach(card => {
      for (let i = 0; i < card.qty; i++) deck.push({ id: card.id, type: "steal", name: card.name, img: card.img });
    });

    // 🔄 UNO-LIKE (6 cartes)
    const uno = [
      { id: "REVERSE", name: "Inversion", img: "reverse.png", qty: 2 },
      { id: "SKIP", name: "Passe Ton Tour", img: "skip.png", qty: 2 },
      { id: "FREEZE", name: "Gel", img: "freeze.png", qty: 1 },
      { id: "ALL_DRAW", name: "Tout le Monde Pioche", img: "all_draw.png", qty: 1 }
    ];

    uno.forEach(card => {
      for (let i = 0; i < card.qty; i++) deck.push({ id: card.id, type: "uno", name: card.name, img: card.img });
    });

    // 💀 CHAOS (5 cartes)
    const chaos = [
      { id: "RUSSIAN_ROULETTE", name: "Roulette Russe", img: "roulette.png", qty: 2 },
      { id: "VIRUS", name: "Virus", img: "virus.png", qty: 1 },
      { id: "CURSE", name: "Malédiction", img: "curse.png", qty: 1 },
      { id: "POISON_GIFT", name: "Cadeau Empoisonné", img: "poison_gift.png", qty: 1 }
    ];

    chaos.forEach(card => {
      for (let i = 0; i < card.qty; i++) deck.push({ id: card.id, type: "chaos", name: card.name, img: card.img });
    });

    // Mélange
    return deck.sort(() => Math.random() - 0.5);
  }
}

// ============================================
// CLASSE EFFECTS - IMPLÉMENTATION COMPLÈTE
// ============================================
class Effects {
  static apply(game, playerId, card, targetId, gameState) {
    const players = game.players;
    const caster = players[playerId];
    const target = targetId ? players[targetId] : null;
    
    let message = `${caster.pseudo} joue ${card.name}`;

    switch (card.id) {
      // 🟢 CARTES BONUS
      case "GIVE_2":
        if (target) {
          target.drinks = (target.drinks || 0) + 2;
          message += ` → ${target.pseudo} boit 2 🍺`;
        }
        break;

      case "GIVE_3":
        if (target) {
          target.drinks = (target.drinks || 0) + 3;
          message += ` → ${target.pseudo} boit 3 🍺`;
        }
        break;

      case "GIVE_5":
        if (target) {
          target.drinks = (target.drinks || 0) + 5;
          message += ` → ${target.pseudo} boit 5 🍺`;
        }
        break;

      case "DOUBLE_DISTRIBUTION": {
        message += ` → distribue 1 gorgée à deux joueurs`;
        gameState.waitingForTargets = { card, count: 2, drinkAmount: 1 };
        break;
      }

      case "DRAW_2":
        for (let i = 0; i < 2; i++) {
          if (game.deck.length > 0) {
            caster.hand.push(game.deck.pop());
          }
        }
        message += ` → pioche 2 cartes`;
        break;

      case "EXTRA_TURN":
        gameState.extraTurn = true;
        message += ` → rejoue immédiatement`;
        break;

      case "PROTECTION":
        caster.protection = true;
        message += ` → est protégé contre le prochain effet de gorgées jusqu'à son prochain tour`;
        break;

      case "GIFT":
        if (target) {
          for (let i = 0; i < 2; i++) {
            if (game.deck.length > 0) {
              target.hand.push(game.deck.pop());
            }
          }
          message += ` → ${target.pseudo} pioche 2 cartes`;
        }
        break;

      case "ALLIANCE":
        if (target) {
          caster.alliance = targetId;
          target.alliance = playerId;
          message += ` → alliance entre ${caster.pseudo} et ${target.pseudo} (protection mutuelle)`;
        }
        break;

      // 🔴 MALUS CIBLÉS
      case "PLUS2":
        if (target) {
          if (!target.protection && !target.alliance) {
            target.drinks = (target.drinks || 0) + 2;
            message += ` → ${target.pseudo} boit 2 🍺`;
          } else {
            message += ` → ${target.pseudo} est protégé!`;
          }
        }
        break;

      case "PLUS3":
        if (target) {
          if (!target.protection && !target.alliance) {
            target.drinks = (target.drinks || 0) + 3;
            message += ` → ${target.pseudo} boit 3 🍺`;
          } else {
            message += ` → ${target.pseudo} est protégé!`;
          }
        }
        break;

      case "PLUS5":
        if (target) {
          if (!target.protection && !target.alliance) {
            target.drinks = (target.drinks || 0) + 5;
            message += ` → ${target.pseudo} boit 5 🍺`;
          } else {
            message += ` → ${target.pseudo} est protégé!`;
          }
        }
        break;

      case "DOUBLE_PENALTY":
        if (target && !target.protection && !target.alliance) {
          target.drinks = (target.drinks || 0) + 2;
          target.delayedDrinks = (target.delayedDrinks || 0) + 2;
          message += ` → ${target.pseudo} boit 2 maintenant et 2 à son prochain tour`;
        }
        break;

      case "RELENTLESS": {
        if (target && !target.protection && !target.alliance) {
          const otherPlayers = Object.values(players).filter(p => p !== target && p.id !== playerId);
          otherPlayers.forEach(p => {
            p.drinks = (p.drinks || 0) + 1;
          });
          message += ` → tous les autres attaquent ${target.pseudo} (1 gorgée chacun)`;
        }
        break;
      }

      case "TRIBUNAL": {
        message += ` → tribunal - tous les joueurs votent! Le plus votés boit 4 🍺`;
        gameState.voting = true;
        break;
      }

      case "PUBLIC_ENEMY":
        if (target) {
          target.enemyOfPublic = true;
          message += ` → ${target.pseudo} est ennemi public (+1 aux attaques)`;
        }
        break;

      // 🔴 MALUS GÉNÉRAL
      case "DRINK_2":
        caster.drinks = (caster.drinks || 0) + 2;
        message += ` → boit 2 🍺`;
        break;

      case "DRINK_3":
        caster.drinks = (caster.drinks || 0) + 3;
        message += ` → boit 3 🍺`;
        break;

      case "DRINK_5":
        caster.drinks = (caster.drinks || 0) + 5;
        message += ` → boit 5 🍺`;
        break;

      case "ALL_EXCEPT_YOU": {
        const otherPlayers = Object.values(players).filter(p => p !== caster);
        otherPlayers.forEach(p => {
          p.drinks = (p.drinks || 0) + 1;
        });
        message += ` → tous les autres boivent 1 🍺`;
        break;
      }

      case "LEFT": {
        const playerIds = Object.keys(players);
        const idx = playerIds.indexOf(playerId);
        const leftIdx = (idx - 1 + playerIds.length) % playerIds.length;
        const leftPlayer = players[playerIds[leftIdx]];
        leftPlayer.drinks = (leftPlayer.drinks || 0) + 3;
        message += ` → ${leftPlayer.pseudo} (à gauche) boit 3 🍺`;
        break;
      }

      case "DISCARD": {
        if (caster.hand.length > 0) {
          const randomIdx = Math.floor(Math.random() * caster.hand.length);
          caster.hand.splice(randomIdx, 1);
          message += ` → défausse une carte aléatoire`;
        }
        break;
      }

      // 🟣 CARTES SPÉCIALES
      case "SHIELD":
        caster.shield = true;
        message += ` → annule un effet de gorgées reçu`;
        break;

      case "MIRROR":
        caster.mirror = true;
        message += ` → renvoie un effet ciblé à son expéditeur`;
        break;

      case "DOUBLE_EFFECT":
        gameState.doubleNextEffect = true;
        message += ` → double les gorgées de la prochaine carte`;
        break;

      case "BOMB":
        gameState.bombActive = true;
        message += ` → le prochain joueur boit 5 🍺`;
        break;

      case "BACKFIRE":
        caster.backfire = true;
        message += ` → le prochain malus reçu est renvoyé à l'expéditeur`;
        break;

      // 🕵️ CARTES INFORMATION
      case "SPY":
        if (target) {
          gameState.spyTarget = targetId;
          const cardsShown = target.hand.slice(0, 2).map(c => c.name).join(", ");
          message += ` → regarde 2 cartes de ${target.pseudo}: ${cardsShown}`;
        }
        break;

      case "DETECTIVE":
        if (target) {
          gameState.detectiveTarget = targetId;
          const randomCard = target.hand[Math.floor(Math.random() * target.hand.length)];
          message += ` → voit une carte aléatoire: ${randomCard.name}`;
        }
        break;

      case "XRAY":
        if (target) {
          const specialCount = target.hand.filter(c => c.type === "special").length;
          message += ` → ${target.pseudo} a ${specialCount} carte(s) spéciale(s)`;
        }
        break;

      // 🥷 CARTES VOL / ÉCHANGE
      case "THIEF":
        if (target && target.hand.length > 0) {
          const randomIdx = Math.floor(Math.random() * target.hand.length);
          const stolen = target.hand[randomIdx];
          target.hand.splice(randomIdx, 1);
          caster.hand.push(stolen);
          message += ` → vole une carte aléatoire à ${target.pseudo}`;
        }
        break;

      case "PICKPOCKET":
        if (target && target.hand.length > 0) {
          const randomIdx = Math.floor(Math.random() * target.hand.length);
          const stolen = target.hand[randomIdx];
          target.hand.splice(randomIdx, 1);
          caster.hand.push(stolen);
          message += ` → pickpocket une carte de ${target.pseudo}`;
        }
        break;

      case "MYSTERY_HAND": {
        const playerIds = Object.keys(players);
        const cardsToSwap = [];
        
        // Collecter une carte aléatoire de chaque joueur
        playerIds.forEach((id) => {
          if (players[id].hand.length > 0) {
            const randomIdx = Math.floor(Math.random() * players[id].hand.length);
            cardsToSwap.push({ card: players[id].hand[randomIdx], fromId: id });
          }
        });

        // Retirer les cartes
        playerIds.forEach((id) => {
          if (players[id].hand.length > 0) {
            const randomIdx = Math.floor(Math.random() * players[id].hand.length);
            players[id].hand.splice(randomIdx, 1);
          }
        });

        // Distribuer à DROITE
        cardsToSwap.forEach((item, idx) => {
          const rightIdx = (idx + 1) % playerIds.length;
          players[playerIds[rightIdx]].hand.push(item.card);
        });

        message += ` → tous donnent une carte face cachée à leur voisin de droite`;
        break;
      }

      case "BLACK_MARKET":
        if (target && target.hand.length > 0 && caster.hand.length > 0) {
          const myCardIdx = Math.floor(Math.random() * caster.hand.length);
          const theirCardIdx = Math.floor(Math.random() * target.hand.length);
          
          const myCard = caster.hand[myCardIdx];
          const theirCard = target.hand[theirCardIdx];
          
          caster.hand[myCardIdx] = theirCard;
          target.hand[theirCardIdx] = myCard;
          
          message += ` → échange une carte aléatoire avec ${target.pseudo}`;
        }
        break;

      case "FULL_SWAP":
        if (target) {
          const temp = [...caster.hand];
          caster.hand = [...target.hand];
          target.hand = temp;
          message += ` → échange ENTIÈREMENT sa main avec ${target.pseudo}`;
        }
        break;

      // 🔄 CARTES STYLE UNO
      case "REVERSE":
        game.gameDirection = (game.gameDirection || 1) * -1;
        message += ` → ↩️ inverse le sens du jeu!`;
        break;

      case "SKIP":
        if (target) {
          target.skip = true;
          target.skipCanBeBlocked = true;
          message += ` → ${target.pseudo} passe son prochain tour`;
        }
        break;

      case "FREEZE":
        if (target) {
          target.frozen = true;
          target.freezeCannotBeBlocked = true;
          message += ` → ${target.pseudo} perd son prochain tour (ne peut pas être contré)`;
        }
        break;

      case "ALL_DRAW": {
        Object.values(players).forEach(p => {
          if (game.deck.length > 0) {
            p.hand.push(game.deck.pop());
          }
        });
        message += ` → tous les joueurs piochent 1 carte`;
        break;
      }

      // 💀 CARTES CHAOS
      case "RUSSIAN_ROULETTE": {
        const outcome = Math.random() < 0.5;
        if (outcome) {
          caster.drinks = (caster.drinks || 0) + 4;
          message += ` → 🎲 tu bois 4 🍺`;
        } else {
          const otherPlayers = Object.values(players).filter(p => p !== caster);
          otherPlayers.forEach(p => {
            p.drinks = (p.drinks || 0) + 4;
          });
          message += ` → 🎲 tous les autres boivent 4 🍺`;
        }
        break;
      }

      case "VIRUS": {
        if (target) {
          const playerIds = Object.keys(players);
          const idx = playerIds.indexOf(targetId);
          const left = players[playerIds[(idx - 1 + playerIds.length) % playerIds.length]];
          const right = players[playerIds[(idx + 1) % playerIds.length]];
          left.drinks = (left.drinks || 0) + 2;
          right.drinks = (right.drinks || 0) + 2;
          message += ` → virus chez ${target.pseudo}, les adjacents boivent 2 🍺`;
        }
        break;
      }

      case "CURSE":
        caster.cursed = true;
        message += ` → est maudit (boit 1 🍺 à chaque début de tour)`;
        break;

      case "POISON_GIFT":
        if (target && caster.hand.length > 0) {
          const randomIdx = Math.floor(Math.random() * caster.hand.length);
          const card = caster.hand[randomIdx];
          caster.hand.splice(randomIdx, 1);
          target.hand.push(card);
          message += ` → donne une carte empoisonnée à ${target.pseudo}`;
        }
        break;
    }

    return message;
  }

  static needsTarget(cardId) {
    return [
      "GIVE_2", "GIVE_3", "GIVE_5",
      "DOUBLE_DISTRIBUTION",
      "GIFT", "ALLIANCE",
      "PLUS2", "PLUS3", "PLUS5",
      "DOUBLE_PENALTY", "RELENTLESS", "PUBLIC_ENEMY",
      "THIEF", "PICKPOCKET", "BLACK_MARKET", "FULL_SWAP",
      "SPY", "DETECTIVE", "XRAY",
      "SKIP", "FREEZE", "VIRUS"
    ].includes(cardId);
  }

  static canBlockSkip(cardId) {
    return ["SHIELD", "MIRROR"].includes(cardId);
  }
}

// ============================================
// CONTRÔLEUR DE JEU
// ============================================
class GameController {
  constructor() {
    this.playerId = Math.random().toString(36).substring(2);
    this.room = "main";
    this.selectedTarget = null;
    this.gameState = {
      extraTurn: false,
      voting: false,
      doubleNextEffect: false,
      bombActive: false,
      waitingForTargets: null,
      spyTarget: null,
      detectiveTarget: null
    };

    this.setupListeners();
  }

  setupListeners() {
    document.getElementById("pseudo").addEventListener("keypress", (e) => {
      if (e.key === "Enter") this.join();
    });
  }

  join() {
    const pseudo = document.getElementById("pseudo").value;
    if (!pseudo) return alert("Entre un pseudo");

    db.ref(`rooms/${this.room}`).once("value").then((snapshot) => {
      const game = snapshot.val();

      if (game && game.started) {
        return alert("❌ Partie déjà en cours");
      }

      db.ref(`rooms/${this.room}/players/${this.playerId}`).set({
        pseudo,
        hand: [],
        drinks: 0,
        protection: false,
        alliance: null,
        shield: false,
        mirror: false,
        backfire: false,
        cursed: false,
        skip: false,
        skipCanBeBlocked: false,
        frozen: false,
        freezeCannotBeBlocked: false,
        enemyOfPublic: false,
        delayedDrinks: 0
      });

      document.getElementById("login").classList.add("hidden");
      document.getElementById("game").classList.remove("hidden");

      this.listenGame();
    });
  }

  start() {
    db.ref(`rooms/${this.room}`).once("value").then((snapshot) => {
      const game = snapshot.val();
      const players = Object.keys(game.players);
      const deck = Deck.create();

      // Distribuer 5 cartes à chaque joueur
      players.forEach((id) => {
        const hand = [];
        for (let i = 0; i < 5; i++) {
          hand.push(deck.pop());
        }
        db.ref(`rooms/${this.room}/players/${id}/hand`).set(hand);
      });

      db.ref(`rooms/${this.room}`).update({
        deck: deck,
        currentPlayerIndex: 0,
        gameDirection: 1,
        started: true,
        message: "🔥 La partie commence!"
      });
    });
  }

  playCard(index) {
    db.ref(`rooms/${this.room}`).once("value").then((snapshot) => {
      const game = snapshot.val();
      const players = Object.keys(game.players);
      const currentId = players[game.currentPlayerIndex];

      if (currentId !== this.playerId) return alert("Pas ton tour");

      const hand = game.players[this.playerId].hand;
      const card = hand[index];

      // Ne pas jouer le Diable Noir
      if (card.id === "DIABLE_NOIR") return alert("❌ Tu ne peux pas jouer le Diable Noir");

      // Vérifier si une cible est nécessaire
      if (Effects.needsTarget(card.id) && !this.selectedTarget) {
        return alert("Choisis une cible");
      }

      if (Effects.needsTarget(card.id) && this.selectedTarget === this.playerId) {
        return alert("Tu ne peux pas te cibler toi-même");
      }

      // Retirer la carte de la main
      hand.splice(index, 1);

      // Appliquer l'effet
      const message = Effects.apply(game, this.playerId, card, this.selectedTarget, this.gameState);

      // Piocher une nouvelle carte
      if (game.deck.length > 0) {
        hand.push(game.deck.pop());
      }

      db.ref(`rooms/${this.room}/players/${this.playerId}/hand`).set(hand);

      // LOGIQUE DE TOUR AMÉLIORÉE AVEC DIRECTION
      let nextIndex = game.currentPlayerIndex;
      let skipMessage = "";

      if (!this.gameState.extraTurn) {
        const direction = game.gameDirection || 1;
        nextIndex = (game.currentPlayerIndex + direction + players.length) % players.length;

        const nextPlayerId = players[nextIndex];
        const nextPlayer = game.players[nextPlayerId];

        // Vérifier SKIP (peut être bloqué par Bouclier/Miroir)
        if (nextPlayer.skip && nextPlayer.skipCanBeBlocked) {
          // Le joueur peut jouer Bouclier ou Miroir pour l'éviter
          skipMessage = `⏭️ ${nextPlayer.pseudo} aurait son tour passé (peut être bloqué)`;
          nextPlayer.skip = false;
        } else if (nextPlayer.skip) {
          // FREEZE ne peut PAS être bloqué
          skipMessage = `❄️ ${nextPlayer.pseudo} perd son tour (Gel - non contrable)`;
          nextPlayer.frozen = false;
          nextIndex = (nextIndex + direction + players.length) % players.length;
        }
      }

      this.gameState.extraTurn = false;
      this.selectedTarget = null;

      db.ref(`rooms/${this.room}`).update({
        currentPlayerIndex: nextIndex,
        message: skipMessage ? skipMessage + "\n" + message : message,
        gameDirection: game.gameDirection || 1
      });

      this.checkWinCondition(game);
    });
  }

  selectTarget(targetId) {
    this.selectedTarget = this.selectedTarget === targetId ? null : targetId;
    this.renderGame();
  }

  listenGame() {
    db.ref(`rooms/${this.room}`).on("value", (snapshot) => {
      if (snapshot.exists()) {
        this.renderGame();
      }
    });
  }

  renderGame() {
    db.ref(`rooms/${this.room}`).once("value").then((snapshot) => {
      const game = snapshot.val();
      if (!game) return;

      const players = game.players || {};
      const playerIds = Object.keys(players);

      // Affichage central
      const center = document.getElementById("center");
      if (!game.started) {
        center.textContent = `⏳ En attente... (${playerIds.length} joueur${playerIds.length > 1 ? 's' : ''})`;
        document.getElementById("startBtn").classList.toggle("hidden", this.playerId !== playerIds[0]);
      } else {
        const currentPlayerId = playerIds[game.currentPlayerIndex];
        const currentPlayer = players[currentPlayerId];
        center.textContent = currentPlayerId === this.playerId ? "🎮 C'est TON TOUR!" : `🎮 Tour de ${currentPlayer.pseudo}`;
      }

      // Message
      document.getElementById("message").textContent = game.message || "";

      // Cercle de joueurs
      const circle = document.getElementById("circle");
      circle.innerHTML = "";
      playerIds.forEach((id, idx) => {
        const player = players[id];
        const angle = (idx / playerIds.length) * 2 * Math.PI - Math.PI / 2;
        const x = 150 + 100 * Math.cos(angle);
        const y = 150 + 100 * Math.sin(angle);

        const el = document.createElement("div");
        el.className = "player";
        if (id === this.selectedTarget) el.classList.add("selected");
        if (player.skip && player.skipCanBeBlocked) el.classList.add("skipped");
        if (player.frozen) el.classList.add("frozen");

        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        el.style.transform = "translate(-50%, -50%)";

        let status = `${player.hand.length} carte${player.hand.length > 1 ? 's' : ''}`;
        let statusClass = "";
        if (player.protection) { status += " 🛡️"; statusClass = "protected"; }
        if (player.frozen) { status += " ❄️"; statusClass = "frozen"; }

        el.innerHTML = `
          <div class="player-name">${player.pseudo}</div>
          <div class="player-status ${statusClass}">${status}</div>
        `;

        if (game.started) {
          el.onclick = () => this.selectTarget(id);
        }

        circle.appendChild(el);
      });

      // Main
      const hand = document.getElementById("hand");
      hand.innerHTML = "";
      const myHand = players[this.playerId]?.hand || [];
      myHand.forEach((card, idx) => {
        const el = document.createElement("div");
        el.className = "card";
        if (card.id === "DIABLE_NOIR") el.classList.add("diable-noir");
        el.innerHTML = `<img src="assets/${card.img}" alt="${card.name}" title="${card.name}">`;
        el.onclick = () => this.playCard(idx);
        hand.appendChild(el);
      });
    });
  }

  checkWinCondition(game) {
    const players = game.players || {};
    Object.values(players).forEach(player => {
      if (player.hand.some(c => c.id === "DIABLE_NOIR") && game.deck.length === 0) {
        db.ref(`rooms/${this.room}`).update({
          message: "💀 " + player.pseudo + " avait le Diable Noir! IL PERD!"
        });
      }
    });
  }

  reset() {
    db.ref(`rooms/${this.room}`).remove();
    location.reload();
  }
}

const gameController = new GameController();
</script>
