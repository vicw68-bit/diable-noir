<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>😈 Diable Noir - Jeu de Cartes</title>
  <style>
    :root {
      --accent: #ff3333;
      --accent-glow: rgba(255, 51, 51, 0.45);
      --cyan: #00ffcc;
      --bg: #0a0a0a;
      --panel: #141414;
      --hand-h: 150px;
      --hand-hud-h: 46px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      background-image: radial-gradient(ellipse at top, #1a0808 0%, var(--bg) 55%);
      color: white;
      font-family: 'Segoe UI', system-ui, Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(10, 10, 10, 0.92);
      border-bottom: 1px solid #2a2a2a;
      backdrop-filter: blur(8px);
    }

    .app-title {
      color: var(--accent);
      font-size: clamp(1.1rem, 4vw, 1.6rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      text-shadow: 0 0 12px var(--accent-glow);
    }

    .app-subtitle {
      font-size: 0.75rem;
      color: #666;
      margin-top: 2px;
    }

    .header-actions { display: flex; gap: 8px; flex-shrink: 0; }

    .quit-btn {
      background: #333;
      padding: 8px 14px;
      font-size: 0.85rem;
      border-radius: 8px;
    }

    .quit-btn:hover:not(:disabled) { background: #555; transform: none; }

    .force-pass-btn {
      background: #5a4500;
      border: 1px solid #cc9900;
      padding: 8px 12px;
      font-size: 0.82rem;
      border-radius: 8px;
      white-space: nowrap;
    }

    .force-pass-btn:hover:not(:disabled) {
      background: #7a6000;
      transform: none;
    }

    @media (max-width: 480px) {
      .force-pass-btn .force-pass-label { display: none; }
      .quit-btn { padding: 8px 10px; }
    }

    .app-main {
      flex: 1;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px 16px calc(var(--hand-h) + 24px);
    }

    .screen { width: 100%; }
    .screen.hidden { display: none; }

    #login {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding-top: 10vh;
    }

    body.in-game #login {
      padding-top: 16px;
      gap: 12px;
    }

    body.game-started #login {
      display: none;
    }

    .login-container {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 420px;
    }

    input {
      flex: 1;
      min-width: 160px;
      padding: 14px 16px;
      border: 2px solid var(--accent);
      border-radius: 10px;
      background: var(--panel);
      color: white;
      font-size: 1em;
    }

    input:focus {
      outline: none;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    button {
      padding: 12px 20px;
      background: var(--accent);
      border: none;
      color: white;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.95em;
      transition: background 0.15s, transform 0.15s;
    }

    button:hover:not(:disabled) {
      background: #ff5555;
      transform: translateY(-1px);
    }

    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.hidden { display: none; }

    .game-container { width: 100%; }

    .top-section {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    #startBtn { background: #0a8a0a; }
    #startBtn:hover { background: #0bb50b; }

    .status-bar {
      background: linear-gradient(135deg, rgba(20, 20, 20, 0.92), rgba(28, 12, 12, 0.88));
      border: 1px solid rgba(255, 51, 51, 0.25);
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 12px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
    }

    .center-info {
      font-size: clamp(1rem, 3.5vw, 1.35rem);
      color: var(--cyan);
      font-weight: 700;
      min-height: 1.5em;
    }

    body.game-started .center-info {
      font-size: clamp(0.82rem, 2.8vw, 1rem);
      min-height: 1.2em;
    }

    body.game-started .status-bar {
      padding: 8px 12px;
      margin-bottom: 8px;
    }

    .circle {
      position: relative;
      width: min(420px, 92vw);
      height: min(420px, 92vw);
      margin: 8px auto 0;
      border: 3px solid #5a2020;
      border-radius: 50%;
      box-shadow:
        0 0 40px var(--accent-glow),
        0 12px 40px rgba(0, 0, 0, 0.55),
        inset 0 0 60px rgba(0, 0, 0, 0.45);
      overflow: visible;
    }

    .table-felt {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, rgba(255, 80, 80, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 65% 70%, rgba(0, 255, 200, 0.05) 0%, transparent 40%),
        radial-gradient(circle, #123524 0%, #0a2218 55%, #061510 100%);
      box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.35);
      pointer-events: none;
    }

    .players-layer {
      position: absolute;
      inset: 0;
      z-index: 20;
    }

    .deck-pile {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 74px;
      height: 106px;
      transform: translate(calc(-50% - 42px), -50%) scale(var(--deck-scale, 1));
      z-index: 12;
      transition: transform 0.45s cubic-bezier(0.34, 1.2, 0.64, 1);
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.45));
    }

    .deck-pile.hidden { display: none; }

    .deck-pile__stack {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .deck-pile__layer {
      position: absolute;
      inset: 0;
      border-radius: 10px;
      border: 2px solid #cc2222;
      background:
        linear-gradient(145deg, #2a0810 0%, #120408 40%, #080004 100%);
      box-shadow: inset 0 0 18px rgba(255, 40, 40, 0.15);
      transform: translate(calc(var(--i) * -1.5px), calc(var(--i) * -2px));
    }

    .deck-pile__layer::before {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 80, 80, 0.35);
      background: repeating-linear-gradient(
        45deg,
        rgba(255, 51, 51, 0.06) 0 4px,
        transparent 4px 8px
      );
    }

    .deck-pile__layer::after {
      content: "😈";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      opacity: 0.85;
      text-shadow: 0 0 12px rgba(255, 0, 0, 0.5);
    }

    .deck-pile__count {
      position: absolute;
      left: 50%;
      bottom: -26px;
      transform: translateX(-50%);
      min-width: 2.2em;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(10, 10, 10, 0.88);
      border: 1px solid var(--accent);
      color: #fff;
      font-size: 0.78rem;
      font-weight: 800;
      text-align: center;
      letter-spacing: 0.04em;
    }

    .deck-pile__empty {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      border: 2px dashed rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.35);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .deck-pile.deck-shrunk,
    .deck-pile.deck-draw-pulse {
      animation: deck-pulse 0.45s ease;
    }

    @keyframes deck-pulse {
      0% { transform: translate(calc(-50% - 42px), -50%) scale(var(--deck-scale, 1)); }
      40% { transform: translate(calc(-50% - 42px), -50%) scale(calc(var(--deck-scale, 1) * 0.92)); }
      100% { transform: translate(calc(-50% - 42px), -50%) scale(var(--deck-scale, 1)); }
    }

    .play-zone {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 86px;
      height: 128px;
      transform: translate(calc(-50% + 38px), -50%);
      z-index: 15;
      pointer-events: none;
    }

    .play-zone__card-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      animation: play-zone-in 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes play-zone-in {
      from { opacity: 0; transform: scale(0.35) rotate(-18deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }

    .play-zone__label {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--cyan);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
      text-shadow: 0 0 8px rgba(0, 255, 204, 0.35);
    }

    .play-zone__card {
      width: 86px;
      height: 128px;
      filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.55));
    }

    .play-zone__card .card-face__icon { font-size: 2rem; }

    .fx-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 550;
    }

    .fx-flying-card {
      position: fixed;
      margin: 0;
      left: 0;
      top: 0;
      transition: transform 0.62s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 551;
      pointer-events: none;
      filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.55));
    }

    .deck-card-back {
      position: relative;
      border-radius: 10px;
      border: 2px solid #cc2222;
      background: linear-gradient(145deg, #2a0810 0%, #120408 40%, #080004 100%);
      box-shadow: inset 0 0 18px rgba(255, 40, 40, 0.15);
    }

    .deck-card-back::after {
      content: "😈";
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
    }

    .card-playing-out {
      opacity: 0 !important;
      transform: scale(0.82) !important;
      transition: opacity 0.18s, transform 0.18s;
      pointer-events: none;
    }

    .player.current-turn {
      border-color: var(--cyan);
      box-shadow: 0 0 20px rgba(0, 255, 204, 0.35), 0 0 8px var(--accent-glow);
      animation: turn-glow 2s ease-in-out infinite;
    }

    @keyframes turn-glow {
      0%, 100% { box-shadow: 0 0 16px rgba(0, 255, 204, 0.25); }
      50% { box-shadow: 0 0 24px rgba(0, 255, 204, 0.45); }
    }

    .player {
      position: absolute;
      background: linear-gradient(145deg, #1e1e1e, #2c2c2c);
      padding: 10px 12px;
      border-radius: 10px;
      border: 2px solid var(--accent);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      min-width: 88px;
      max-width: 120px;
      text-align: center;
      transform: translate(-50%, -50%);
      font-size: 0.82rem;
    }

    .player:hover {
      transform: translate(-50%, -50%) scale(1.06);
      box-shadow: 0 0 14px var(--accent-glow);
    }

    .player.selected {
      background: linear-gradient(145deg, #ff3333, #cc2222);
      box-shadow: 0 0 18px var(--accent-glow);
    }

    .player.clickable { cursor: pointer; }
    .player:not(.clickable) { cursor: default; }

    .player.skipped { opacity: 0.55; border-color: #ffaa00; }
    .player.frozen {
      opacity: 0.85;
      border-color: #00ccff;
      background: linear-gradient(145deg, #1a3a4a, #1a4a5a);
    }
    .player.protected { border-color: #00ff88; }
    .player.enemy { border-color: #ff00ff; }

    .player-name { font-weight: 700; font-size: 0.9em; }
    .player-badges { font-size: 1em; margin: 4px 0; letter-spacing: 1px; min-height: 1.3em; }
    .player-status { font-size: 0.75em; color: #999; }

    /* HUD compact — juste au-dessus de la main */
    body.banner-open {
      --hand-hud-h: 68px;
    }

    .hand-hud {
      position: fixed;
      left: 0;
      right: 0;
      bottom: var(--hand-h);
      z-index: 205;
      display: flex;
      flex-direction: column;
      pointer-events: none;
    }

    .hand-hud.hidden { display: none; }

    .hand-hud > * { pointer-events: auto; }

    .action-banner {
      position: relative;
      left: auto;
      top: auto;
      transform: none;
      z-index: 1;
      width: 100%;
      background: rgba(12, 22, 28, 0.96);
      border: none;
      border-top: 1px solid rgba(0, 255, 204, 0.35);
      border-bottom: 1px solid rgba(0, 255, 204, 0.12);
      border-radius: 0;
      padding: 5px 10px;
      text-align: center;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.35);
    }

    .action-banner.hidden { display: none; }

    .action-banner__title {
      display: block;
      color: var(--cyan);
      font-size: 0.72rem;
      font-weight: 700;
      line-height: 1.25;
    }

    .action-banner__hint {
      display: block;
      color: #aab;
      font-size: 0.62rem;
      line-height: 1.3;
      margin-top: 2px;
    }

    .hand-feed {
      background: rgba(5, 8, 7, 0.94);
      border-top: 1px solid rgba(255, 51, 51, 0.18);
      padding: 4px 10px 5px;
      max-height: var(--hand-hud-h);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .hand-feed.hidden { display: none; }

    body.banner-open .hand-feed {
      max-height: calc(var(--hand-hud-h) - 28px);
    }

    .hand-feed .message {
      color: #8ec;
      margin: 0;
      font-size: 0.65rem;
      line-height: 1.35;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    /* Panneau réaction / pickpocket — AU-DESSUS de la main, cliquable */
    .floating-panel {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(var(--hand-h) + var(--hand-hud-h));
      z-index: 280;
      background: linear-gradient(to top, rgba(10,10,10,0.98), rgba(20,10,10,0.95));
      border-top: 2px solid var(--accent);
      padding: 12px 16px 14px;
      text-align: center;
    }

    .floating-panel.hidden { display: none; }

    .floating-panel h3 {
      color: #ff6666;
      font-size: 1rem;
      margin-bottom: 6px;
    }

    .floating-panel p {
      color: #bbb;
      font-size: 0.85rem;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .panel-cards {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 10px 0;
    }

    .panel-pass {
      margin-top: 8px;
      background: #444;
      font-size: 0.85rem;
      padding: 10px 18px;
    }

    .panel-pass:hover { background: #666; transform: none; }

    .hand {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--hand-h);
      background: linear-gradient(to top, rgba(4, 4, 4, 0.98) 0%, rgba(16, 8, 8, 0.94) 100%);
      border-top: 2px solid var(--accent);
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 80, 80, 0.08);
      padding: 10px 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      z-index: 200;
      -webkit-overflow-scrolling: touch;
    }

    .hand-label {
      display: none;
    }

    .hand-label.hidden { display: none; }

    .card {
      width: 72px;
      height: 108px;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.2s ease, filter 0.2s;
      perspective: 600px;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.06);
      transition: box-shadow 0.2s, transform 0.2s;
    }

    .card:hover:not(.disabled) .card-inner {
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.65), 0 0 18px var(--card-glow, rgba(255, 51, 51, 0.35));
      transform: translateY(-2px) rotateX(4deg);
    }

    .card:hover:not(.disabled) { transform: translateY(-10px) scale(1.05); }

    .card-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 3;
      border-radius: 10px;
    }

    .card-face {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 5px 4px 4px;
      border-radius: 10px;
      border: 2px solid var(--card-border, var(--accent));
      background: var(--card-bg, linear-gradient(145deg, #1a1a1a, #2a2a2a));
      overflow: hidden;
      text-align: center;
      --card-glow: rgba(255, 51, 51, 0.4);
    }

    .card-face__shine {
      position: absolute;
      inset: 0;
      background: linear-gradient(125deg, rgba(255,255,255,0.18) 0%, transparent 40%, transparent 60%, rgba(255,255,255,0.06) 100%);
      pointer-events: none;
      z-index: 1;
    }

    .card-face__pattern {
      position: absolute;
      inset: 0;
      opacity: 0.12;
      background-image: radial-gradient(circle at 20% 80%, white 1px, transparent 1px);
      background-size: 8px 8px;
      pointer-events: none;
    }

    .card-face__icon {
      font-size: clamp(1.4rem, 5vw, 1.85rem);
      line-height: 1;
      z-index: 2;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .card-face__name {
      font-size: clamp(0.45rem, 1.8vw, 0.58rem);
      font-weight: 800;
      line-height: 1.15;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      z-index: 2;
      max-width: 100%;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      letter-spacing: 0.02em;
    }

    .card-face__badge {
      font-size: clamp(0.55rem, 2vw, 0.68rem);
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(0,0,0,0.45);
      color: var(--card-accent, #fff);
      border: 1px solid rgba(255,255,255,0.2);
      z-index: 2;
    }

    .card-face__type {
      position: absolute;
      top: 3px;
      right: 3px;
      font-size: 0.45rem;
      opacity: 0.7;
      z-index: 2;
    }

    /* Thèmes par type */
    .card-type-bonus .card-face {
      --card-bg: linear-gradient(155deg, #0f3d28 0%, #1a6b45 45%, #0a2818 100%);
      --card-border: #ffd700;
      --card-accent: #ffe566;
      --card-glow: rgba(255, 215, 0, 0.45);
    }

    .card-type-malus_target .card-face {
      --card-bg: linear-gradient(155deg, #4a0a0a 0%, #8b1515 45%, #2a0505 100%);
      --card-border: #ff4444;
      --card-accent: #ff8888;
      --card-glow: rgba(255, 68, 68, 0.5);
    }

    .card-type-malus_global .card-face {
      --card-bg: linear-gradient(155deg, #4a2808 0%, #8b5010 45%, #281804 100%);
      --card-border: #ff9922;
      --card-accent: #ffcc66;
      --card-glow: rgba(255, 153, 34, 0.45);
    }

    .card-type-special .card-face {
      --card-bg: linear-gradient(155deg, #1a2048 0%, #3040a0 45%, #101830 100%);
      --card-border: #88aaff;
      --card-accent: #aaccff;
      --card-glow: rgba(136, 170, 255, 0.45);
    }

    .card-type-info .card-face {
      --card-bg: linear-gradient(155deg, #0a2848 0%, #2060a0 45%, #081828 100%);
      --card-border: #00ccff;
      --card-accent: #66eeff;
      --card-glow: rgba(0, 204, 255, 0.4);
    }

    .card-type-steal .card-face {
      --card-bg: linear-gradient(155deg, #2a1038 0%, #5a2080 45%, #180820 100%);
      --card-border: #cc66ff;
      --card-accent: #ee99ff;
      --card-glow: rgba(204, 102, 255, 0.45);
    }

    .card-type-uno .card-face {
      --card-bg: linear-gradient(155deg, #0a3838 0%, #208080 45%, #082020 100%);
      --card-border: #00ffcc;
      --card-accent: #66ffee;
      --card-glow: rgba(0, 255, 204, 0.4);
    }

    .card-type-chaos .card-face {
      --card-bg: linear-gradient(155deg, #380828 0%, #802060 45%, #200418 100%);
      --card-border: #ff44aa;
      --card-accent: #ff88cc;
      --card-glow: rgba(255, 68, 170, 0.45);
    }

    .card-type-curse .card-face,
    .card.diable-noir .card-face {
      --card-bg: linear-gradient(155deg, #0a0008 0%, #300010 40%, #000 100%);
      --card-border: #ff0000;
      --card-accent: #ff6666;
      --card-glow: rgba(255, 0, 0, 0.55);
      animation: card-curse-pulse 2.5s ease-in-out infinite;
    }

    @keyframes card-curse-pulse {

const FirebaseSetup = (() => {
  let db = null;
  let ready = false;
  let errorMessage = "";

  function setStatus(type, html) {
    const el = document.getElementById("firebaseStatus");
    if (!el) return;
    el.className = `firebase-status ${type}`;
    el.innerHTML = html;
  }

  function validateConfig(config) {
    if (!config?.apiKey || config.apiKey === "VOTRE_API_KEY") {
      return "Configuration Firebase invalide.";
    }
    if (!config.databaseURL?.startsWith("https://")) {
      return "databaseURL Firebase invalide.";
    }
    return "";
  }

  function formatError(err) {
    const code = err?.code || "";
    const msg = err?.message || String(err);
    if (code === "PERMISSION_DENIED") {
      return "Accès refusé par Firebase.\n\n→ Console Firebase → Realtime Database → Règles\n→ Autorisez read/write pour tester:\n\n{\n  \"rules\": {\n    \".read\": true,\n    \".write\": true\n  }\n}";
    }
    if (msg.includes("API key not valid") || msg.includes("INVALID_API_KEY")) {
      return "Clé API refusée. Firebase Console → Paramètres → Domaines autorisés : ajoutez vicw68-bit.github.io";
    }
    if (msg.includes("Failed to fetch") || msg.includes("NetworkError")) {
      return "Impossible de joindre Firebase (réseau ou pare-feu).";
    }
    return msg;
  }

  function init() {
    const configError = validateConfig(typeof FIREBASE_CONFIG !== "undefined" ? FIREBASE_CONFIG : null);
    if (configError) {
      errorMessage = configError;
      setStatus("error", configError.replace(/\n/g, "<br>"));
      return null;
    }

    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.database();
    } catch (err) {
      errorMessage = formatError(err);
      setStatus("error", errorMessage.replace(/\n/g, "<br>"));
      return null;
    }

    db.ref(".info/connected").on("value", (snap) => {
      if (snap.val() === true) {
        ready = true;
        setStatus("ok", "✅ Connecté — entrez un pseudo pour rejoindre la partie");
      } else {
        setStatus("loading", "Connexion à Firebase…");
      }
    });

    db.ref("_ping").set({ t: Date.now() })
      .then(() => db.ref("_ping").remove())
      .catch((err) => {
        ready = false;
        errorMessage = formatError(err);
        setStatus("error", errorMessage.replace(/\n/g, "<br>"));
      });

    return db;
  }

  return {
    init,
    get db() { return db; },
    get ready() { return ready; },
    get errorMessage() { return errorMessage; },
    formatError,
    setStatus,
  };
})();

function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

    return this.ART[card.id] || { icon: "🃏", badge: card.type || "", desc: "Carte du jeu Diable Noir." };
  },

  description(card) {
    return this.meta(card).desc || "Carte du jeu Diable Noir.";
  },

  faceHtml(card) {
    const { icon, badge } = this.meta(card);
    const typeMark = this.TYPE_LABELS[card.type] || "•";
    const name = card.name.replace(/</g, "&lt;");
    return `
      <div class="card-face">
        <div class="card-face__pattern"></div>
        <div class="card-face__shine"></div>
        <span class="card-face__type">${typeMark}</span>
        <div class="card-face__icon">${icon}</div>
        <div class="card-face__name">${name}</div>
        <div class="card-face__badge">${badge}</div>
      </div>`;
  },

  fillCardElement(el, card, { inspect = true } = {}) {
    const typeClass = `card-type-${(card.type || "bonus").replace(/_/g, "-")}`;
    el.dataset.id = card.id;
    el.classList.add(typeClass);
    el.innerHTML = `
      <div class="card-inner">
        <img class="card-photo" src="${assetUrl(card.img)}" alt="${card.name.replace(/"/g, "&quot;")}" loading="lazy" onerror="this.remove()">
        ${this.faceHtml(card)}
      </div>`;
    if (inspect) CardInspect.attach(el, card);
  },
};

const CardInspect = {
  HOLD_MS: 420,
  MOVE_PX: 14,
  _timer: null,
  _activeEl: null,
  _startX: 0,
  _startY: 0,
  _showing: false,
  _suppressClick: false,

  attach(el, card) {
    el.addEventListener("click", (e) => {
      if (this._suppressClick) {
        e.preventDefault();
        e.stopImmediatePropagation();
        this._suppressClick = false;
      }
    }, true);

    const onDown = (x, y) => {
      this._clearTimer();
      this._activeEl = el;
      this._startX = x;
      this._startY = y;
      this._showing = false;

      el.classList.add("hold-hint");
      this._timer = setTimeout(() => {
        if (this._activeEl !== el) return;
        this._showing = true;
        this.show(card);
        if (navigator.vibrate) navigator.vibrate(12);
      }, this.HOLD_MS);
    };

    const onMove = (x, y) => {
      if (this._activeEl !== el) return;
      if (Math.hypot(x - this._startX, y - this._startY) > this.MOVE_PX) this._cancelHold(el);
    };

    const onUp = () => {
      if (this._activeEl !== el) return;
      if (this._showing) this._suppressClick = true;
      this._cancelHold(el);
      this.hide();
    };

    el.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      onDown(e.clientX, e.clientY);
    });
    el.addEventListener("pointermove", (e) => onMove(e.clientX, e.clientY));
    el.addEventListener("pointerup", onUp);
    el.addEventListener("pointercancel", onUp);
    el.addEventListener("pointerleave", (e) => {
      if (this._showing && this._activeEl === el) this.hide();
      if (this._activeEl === el && e.buttons === 0) this._cancelHold(el);
    });
  },

  _clearTimer() {
    if (this._timer) {
      clearTimeout(this._timer);
      this._timer = null;
    }
  },

  _cancelHold(el) {
    this._clearTimer();
    el?.classList.remove("hold-hint");
    this._activeEl = null;
    this._showing = false;
  },

  show(card) {
    const overlay = document.getElementById("cardInspect");
    const preview = document.getElementById("cardInspectPreview");
    if (!overlay || !preview) return;

    preview.innerHTML = "";
    const big = document.createElement("div");
    big.className = "card";
    if (card.id === "DIABLE_NOIR" || card.id === "CURSE") big.classList.add("diable-noir");
    CardVisuals.fillCardElement(big, card, { inspect: false });
    preview.appendChild(big);

    document.getElementById("cardInspectTitle").textContent = card.name;
    document.getElementById("cardInspectDesc").textContent = CardVisuals.description(card);
    overlay.classList.remove("hidden");
    overlay.setAttribute("aria-hidden", "false");
  },

  hide() {
    const overlay = document.getElementById("cardInspect");
    if (!overlay) return;
    overlay.classList.add("hidden");
    overlay.setAttribute("aria-hidden", "true");
    document.querySelectorAll(".card.hold-hint").forEach(el => el.classList.remove("hold-hint"));
    this._showing = false;
    this._activeEl = null;
  },
};

const TableFX = {
  isAnimating: false,
  seenPlayTs: 0,
  prevDeckSize: null,
  prevHandSize: 0,
  localPlayPending: false,
  _playZoneTimer: null,
  _lastDrawForPlayTs: 0,

  deckEl() { return document.getElementById("deckPile"); },
  playZoneEl() { return document.getElementById("playZone"); },
  fxLayer() { return document.getElementById("fxLayer"); },

  updateDeck(deckSize, initialSize, started) {
    const el = this.deckEl();
    if (!el) return;

    if (!started) {
      el.classList.add("hidden");
      return;
    }
    el.classList.remove("hidden");

    const initial = Math.max(initialSize || deckSize || 1, 1);
    const ratio = initial ? Math.min(1, deckSize / initial) : 0;
    const layerCount = deckSize <= 0 ? 0 : Math.max(1, Math.min(7, Math.ceil(ratio * 7)));

    el.style.setProperty("--deck-scale", (0.78 + ratio * 0.22).toFixed(2));

    const stack = el.querySelector(".deck-pile__stack");
    const prevLayers = stack ? parseInt(stack.dataset.layers || "0", 10) : -1;
    const shrunk = this.prevDeckSize !== null && deckSize < this.prevDeckSize;

    if (!stack || prevLayers !== layerCount) {
      el.innerHTML = layerCount
        ? `<div class="deck-pile__stack" data-layers="${layerCount}">${Array.from(
            { length: layerCount },
            (_, i) => `<div class="deck-pile__layer" style="--i:${i}"></div>`
          ).join("")}</div><div class="deck-pile__count">${deckSize}</div>`
        : `<div class="deck-pile__empty">Vide</div><div class="deck-pile__count">0</div>`;
    } else {
      const count = el.querySelector(".deck-pile__count");
      if (count) count.textContent = deckSize;
    }

    if (shrunk) {
      el.classList.add("deck-shrunk");
      setTimeout(() => el.classList.remove("deck-shrunk"), 450);
    }
  },

  showInPlayZone(card, playerName) {
    const zone = this.playZoneEl();
    if (!zone) return;
    zone.innerHTML = "";

    const wrap = document.createElement("div");
    wrap.className = "play-zone__card-wrap";

    const label = document.createElement("div");
    label.className = "play-zone__label";
    label.textContent = playerName ? `${playerName} joue` : "";

    const cardEl = document.createElement("div");
    cardEl.className = "card play-zone__card";
    if (card.id === "DIABLE_NOIR" || card.id === "CURSE") cardEl.classList.add("diable-noir");
    CardVisuals.fillCardElement(cardEl, card, { inspect: false });

    wrap.appendChild(label);
    wrap.appendChild(cardEl);
    zone.appendChild(wrap);

    clearTimeout(this._playZoneTimer);
    this._playZoneTimer = setTimeout(() => {
      if (zone.firstChild === wrap) zone.innerHTML = "";
    }, 4000);
  },

  flyCard(fromRect, toRect, card, cardBack, onDone) {
    const layer = this.fxLayer();
    if (!layer) { if (onDone) onDone(); return; }

    const el = document.createElement("div");
    if (cardBack) {
      el.className = "deck-card-back fx-flying-card";
    } else {
      el.className = "card fx-flying-card";
      if (card.id === "DIABLE_NOIR" || card.id === "CURSE") el.classList.add("diable-noir");
      CardVisuals.fillCardElement(el, card, { inspect: false });
    }
    layer.appendChild(el);

    const w = fromRect.width || 72;
    const h = fromRect.height || 108;
    el.style.width = `${w}px`;
    el.style.height = `${h}px`;
    el.style.left = `${fromRect.left}px`;
    el.style.top = `${fromRect.top}px`;

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        const scale = Math.min(toRect.width / w, toRect.height / h, 1.35);
        const tx = toRect.left + toRect.width / 2 - fromRect.left - w / 2;
        const ty = toRect.top + toRect.height / 2 - fromRect.top - h / 2;
        el.style.transform = `translate(${tx}px, ${ty}px) scale(${scale}) rotate(${cardBack ? 720 : 10}deg)`;
      });
    });

    setTimeout(() => {
      el.remove();
      if (onDone) onDone();
    }, 640);
  },

  animatePlayFromHand(sourceEl, card, playerName, callback) {
    if (this.isAnimating) return callback();
    this.isAnimating = true;
    this.localPlayPending = true;

    const playZone = this.playZoneEl();
    const from = sourceEl.getBoundingClientRect();
    const to = playZone ? playZone.getBoundingClientRect() : from;

    sourceEl.classList.add("card-playing-out");

    this.flyCard(from, to, card, false, () => {
      this.showInPlayZone(card, playerName);
      this.isAnimating = false;
      callback();
    });
  },

  animatePlayFromPlayer(playerId, card, playerName) {
    if (this.localPlayPending) {
      this.localPlayPending = false;
      return;
    }
    if (this.isAnimating) return;

    const playerEl = document.querySelector(`.player[data-player-id="${playerId}"]`);
    const playZone = this.playZoneEl();
    const deck = this.deckEl();
    const fromEl = playerEl || deck;
    if (!fromEl || !playZone) {
      this.showInPlayZone(card, playerName);
      return;
    }

    this.isAnimating = true;
    this.flyCard(fromEl.getBoundingClientRect(), playZone.getBoundingClientRect(), card, false, () => {
      this.showInPlayZone(card, playerName);
      this.isAnimating = false;
    });
  },

  animateDrawToHand() {
    const deck = this.deckEl();
    const hand = document.getElementById("hand");
    if (!deck || !hand || deck.classList.contains("hidden")) return;

    const from = deck.getBoundingClientRect();
    const handRect = hand.getBoundingClientRect();
    const to = {
      left: handRect.left + handRect.width / 2 - 36,
      top: handRect.top + 8,
      width: 72,
      height: 108,
    };

    this.flyCard(from, to, null, true);
    deck.classList.add("deck-draw-pulse");
    setTimeout(() => deck.classList.remove("deck-draw-pulse"), 450);
  },

  handleLastPlay(game, localPlayerId) {
    const lp = game.lastPlay;
    if (!lp?.ts || lp.ts === this.seenPlayTs) return;
    this.seenPlayTs = lp.ts;

    if (lp.playerId === localPlayerId) {
      this.localPlayPending = false;
      return;
    }

    const name = game.players?.[lp.playerId]?.pseudo || "?";
    this.animatePlayFromPlayer(lp.playerId, lp.card, name);
  },

  syncDrawState(game, myHandLen, localPlayerId) {
    const deckSize = game.deck?.length ?? 0;
    const lp = game.lastPlay;
    const iPlayedDraw = lp?.playerId === localPlayerId && lp?.ts > (this._lastDrawForPlayTs || 0);

    if (game.started && this.prevDeckSize !== null && deckSize < this.prevDeckSize) {
      if (myHandLen > this.prevHandSize || iPlayedDraw) {
        setTimeout(() => this.animateDrawToHand(), iPlayedDraw ? 420 : 0);
        if (iPlayedDraw) this._lastDrawForPlayTs = lp.ts;
      }
    }
    this.prevDeckSize = deckSize;
    this.prevHandSize = myHandLen;
  },
};
