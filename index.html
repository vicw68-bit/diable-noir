<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>😈 Diable Noir - Jeu de Cartes</title>
  <style>
    :root {
      --accent: #ff3333;
      --accent-glow: rgba(255, 51, 51, 0.45);
      --cyan: #00ffcc;
      --bg: #0a0a0a;
      --panel: #141414;
      --hand-h: 150px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      background-image: radial-gradient(ellipse at top, #1a0808 0%, var(--bg) 55%);
      color: white;
      font-family: 'Segoe UI', system-ui, Arial, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(10, 10, 10, 0.92);
      border-bottom: 1px solid #2a2a2a;
      backdrop-filter: blur(8px);
    }

    .app-title {
      color: var(--accent);
      font-size: clamp(1.1rem, 4vw, 1.6rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      text-shadow: 0 0 12px var(--accent-glow);
    }

    .app-subtitle {
      font-size: 0.75rem;
      color: #666;
      margin-top: 2px;
    }

    .header-actions { display: flex; gap: 8px; flex-shrink: 0; }

    .quit-btn {
      background: #333;
      padding: 8px 14px;
      font-size: 0.85rem;
      border-radius: 8px;
    }

    .quit-btn:hover:not(:disabled) { background: #555; transform: none; }

    .app-main {
      flex: 1;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 12px 16px calc(var(--hand-h) + 24px);
    }

    .screen { width: 100%; }
    .screen.hidden { display: none; }

    #login {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding-top: 10vh;
    }

    .login-container {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 420px;
    }

    input {
      flex: 1;
      min-width: 160px;
      padding: 14px 16px;
      border: 2px solid var(--accent);
      border-radius: 10px;
      background: var(--panel);
      color: white;
      font-size: 1em;
    }

    input:focus {
      outline: none;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    button {
      padding: 12px 20px;
      background: var(--accent);
      border: none;
      color: white;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.95em;
      transition: background 0.15s, transform 0.15s;
    }

    button:hover:not(:disabled) {
      background: #ff5555;
      transform: translateY(-1px);
    }

    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.hidden { display: none; }

    .game-container { width: 100%; }

    .top-section {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    #startBtn { background: #0a8a0a; }
    #startBtn:hover { background: #0bb50b; }

    .status-bar {
      background: var(--panel);
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }

    .center-info {
      font-size: clamp(1rem, 3.5vw, 1.35rem);
      color: var(--cyan);
      font-weight: 700;
      min-height: 1.5em;
    }

    .message {
      color: #9fd;
      margin-top: 8px;
      font-size: 0.9em;
      min-height: 1.2em;
      word-wrap: break-word;
      white-space: pre-wrap;
      line-height: 1.45;
      max-height: 120px;
      overflow-y: auto;
    }

    .circle {
      position: relative;
      width: min(420px, 92vw);
      height: min(420px, 92vw);
      margin: 8px auto 0;
      border: 2px solid var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 30px var(--accent-glow), inset 0 0 40px rgba(0,0,0,0.5);
    }

    .player {
      position: absolute;
      background: linear-gradient(145deg, #1e1e1e, #2c2c2c);
      padding: 10px 12px;
      border-radius: 10px;
      border: 2px solid var(--accent);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      min-width: 88px;
      max-width: 120px;
      text-align: center;
      transform: translate(-50%, -50%);
      font-size: 0.82rem;
    }

    .player:hover {
      transform: translate(-50%, -50%) scale(1.06);
      box-shadow: 0 0 14px var(--accent-glow);
    }

    .player.selected {
      background: linear-gradient(145deg, #ff3333, #cc2222);
      box-shadow: 0 0 18px var(--accent-glow);
    }

    .player.dd-picked {
      background: linear-gradient(145deg, #1a4a3a, #0a6a4a);
      border-color: var(--cyan);
      box-shadow: 0 0 14px rgba(0, 255, 204, 0.5);
    }

    .player.clickable { cursor: pointer; }
    .player:not(.clickable) { cursor: default; }

    .player.skipped { opacity: 0.55; border-color: #ffaa00; }
    .player.frozen {
      opacity: 0.85;
      border-color: #00ccff;
      background: linear-gradient(145deg, #1a3a4a, #1a4a5a);
    }
    .player.protected { border-color: #00ff88; }
    .player.enemy { border-color: #ff00ff; }

    .player-name { font-weight: 700; font-size: 0.9em; }
    .player-badges { font-size: 1em; margin: 4px 0; letter-spacing: 1px; min-height: 1.3em; }
    .player-status { font-size: 0.75em; color: #999; }

    /* Bandeau d'action (non bloquant) */
    .action-banner {
      position: fixed;
      top: 56px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 250;
      width: min(520px, 94vw);
      background: rgba(20, 30, 40, 0.96);
      border: 2px solid var(--cyan);
      border-radius: 12px;
      padding: 12px 16px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    }

    .action-banner.hidden { display: none; }
    .action-banner h3 { color: var(--cyan); font-size: 1rem; margin-bottom: 4px; }
    .action-banner p { color: #ccc; font-size: 0.88rem; }

    /* Panneau réaction / pickpocket — AU-DESSUS de la main, cliquable */
    .floating-panel {
      position: fixed;
      left: 0;
      right: 0;
      bottom: var(--hand-h);
      z-index: 280;
      background: linear-gradient(to top, rgba(10,10,10,0.98), rgba(20,10,10,0.95));
      border-top: 2px solid var(--accent);
      padding: 12px 16px 14px;
      text-align: center;
    }

    .floating-panel.hidden { display: none; }

    .floating-panel h3 {
      color: #ff6666;
      font-size: 1rem;
      margin-bottom: 6px;
    }

    .floating-panel p {
      color: #bbb;
      font-size: 0.85rem;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .panel-cards {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 10px 0;
    }

    .panel-pass {
      margin-top: 8px;
      background: #444;
      font-size: 0.85rem;
      padding: 10px 18px;
    }

    .panel-pass:hover { background: #666; transform: none; }

    .hand {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--hand-h);
      background: rgba(8, 8, 8, 0.97);
      border-top: 2px solid var(--accent);
      padding: 10px 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      z-index: 200;
      -webkit-overflow-scrolling: touch;
    }

    .hand-label {
      position: fixed;
      bottom: var(--hand-h);
      left: 0;
      right: 0;
      z-index: 199;
      text-align: center;
      font-size: 0.75rem;
      color: #666;
      padding: 2px;
      background: rgba(0,0,0,0.6);
    }

    .hand-label.hidden { display: none; }

    .card {
      width: 72px;
      height: 108px;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.2s ease, filter 0.2s;
      perspective: 600px;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.06);
      transition: box-shadow 0.2s, transform 0.2s;
    }

    .card:hover:not(.disabled) .card-inner {
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.65), 0 0 18px var(--card-glow, rgba(255, 51, 51, 0.35));
      transform: translateY(-2px) rotateX(4deg);
    }

    .card:hover:not(.disabled) { transform: translateY(-10px) scale(1.05); }

    .card-photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 3;
      border-radius: 10px;
    }

    .card-face {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 5px 4px 4px;
      border-radius: 10px;
      border: 2px solid var(--card-border, var(--accent));
      background: var(--card-bg, linear-gradient(145deg, #1a1a1a, #2a2a2a));
      overflow: hidden;
      text-align: center;
      --card-glow: rgba(255, 51, 51, 0.4);
    }

    .card-face__shine {
      position: absolute;
      inset: 0;
      background: linear-gradient(125deg, rgba(255,255,255,0.18) 0%, transparent 40%, transparent 60%, rgba(255,255,255,0.06) 100%);
      pointer-events: none;
      z-index: 1;
    }

    .card-face__pattern {
      position: absolute;
      inset: 0;
      opacity: 0.12;
      background-image: radial-gradient(circle at 20% 80%, white 1px, transparent 1px);
      background-size: 8px 8px;
      pointer-events: none;
    }

    .card-face__icon {
      font-size: clamp(1.4rem, 5vw, 1.85rem);
      line-height: 1;
      z-index: 2;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .card-face__name {
      font-size: clamp(0.45rem, 1.8vw, 0.58rem);
      font-weight: 800;
      line-height: 1.15;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      z-index: 2;
      max-width: 100%;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      letter-spacing: 0.02em;
    }

    .card-face__badge {
      font-size: clamp(0.55rem, 2vw, 0.68rem);
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(0,0,0,0.45);
      color: var(--card-accent, #fff);
      border: 1px solid rgba(255,255,255,0.2);
      z-index: 2;
    }

    .card-face__type {
      position: absolute;
      top: 3px;
      right: 3px;
      font-size: 0.45rem;
      opacity: 0.7;
      z-index: 2;
    }

    /* Thèmes par type */
    .card-type-bonus .card-face {
      --card-bg: linear-gradient(155deg, #0f3d28 0%, #1a6b45 45%, #0a2818 100%);
      --card-border: #ffd700;
      --card-accent: #ffe566;
      --card-glow: rgba(255, 215, 0, 0.45);
    }

    .card-type-malus_target .card-face {
      --card-bg: linear-gradient(155deg, #4a0a0a 0%, #8b1515 45%, #2a0505 100%);
      --card-border: #ff4444;
      --card-accent: #ff8888;
      --card-glow: rgba(255, 68, 68, 0.5);
    }

    .card-type-malus_global .card-face {
      --card-bg: linear-gradient(155deg, #4a2808 0%, #8b5010 45%, #281804 100%);
      --card-border: #ff9922;
      --card-accent: #ffcc66;
      --card-glow: rgba(255, 153, 34, 0.45);
    }

    .card-type-special .card-face {
      --card-bg: linear-gradient(155deg, #1a2048 0%, #3040a0 45%, #101830 100%);
      --card-border: #88aaff;
      --card-accent: #aaccff;
      --card-glow: rgba(136, 170, 255, 0.45);
    }

    .card-type-info .card-face {
      --card-bg: linear-gradient(155deg, #0a2848 0%, #2060a0 45%, #081828 100%);
      --card-border: #00ccff;
      --card-accent: #66eeff;
      --card-glow: rgba(0, 204, 255, 0.4);
    }

    .card-type-steal .card-face {
      --card-bg: linear-gradient(155deg, #2a1038 0%, #5a2080 45%, #180820 100%);
      --card-border: #cc66ff;
      --card-accent: #ee99ff;
      --card-glow: rgba(204, 102, 255, 0.45);
    }

    .card-type-uno .card-face {
      --card-bg: linear-gradient(155deg, #0a3838 0%, #208080 45%, #082020 100%);
      --card-border: #00ffcc;
      --card-accent: #66ffee;
      --card-glow: rgba(0, 255, 204, 0.4);
    }

    .card-type-chaos .card-face {
      --card-bg: linear-gradient(155deg, #380828 0%, #802060 45%, #200418 100%);
      --card-border: #ff44aa;
      --card-accent: #ff88cc;
      --card-glow: rgba(255, 68, 170, 0.45);
    }

    .card-type-curse .card-face,
    .card.diable-noir .card-face {
      --card-bg: linear-gradient(155deg, #0a0008 0%, #300010 40%, #000 100%);
      --card-border: #ff0000;
      --card-accent: #ff6666;
      --card-glow: rgba(255, 0, 0, 0.55);
      animation: card-curse-pulse 2.5s ease-in-out infinite;
    }

    @keyframes card-curse-pulse {
      0%, 100% { box-shadow: inset 0 0 20px rgba(255,0,0,0.2); }
      50% { box-shadow: inset 0 0 30px rgba(255,0,0,0.45); }
    }

    .card[data-id="DIABLE_NOIR"] .card-face__icon {
      animation: card-devil 3s ease-in-out infinite;
    }

    @keyframes card-devil {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    .card[data-id="BOMB"] .card-face__icon {
      animation: card-bomb 0.8s ease-in-out infinite;
    }

    @keyframes card-bomb {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }

    .card.disabled .card-inner { filter: grayscale(0.6) brightness(0.7); }

    .card.diable-noir .card-inner,
    .card.curse-card .card-inner {
      filter: saturate(1.3);
    }

    .card.disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }

    .card.needs-target:not(.disabled) {
      opacity: 0.55;
      border: 2px dashed #666;
      border-radius: 8px;
    }

    .card.counter-pick {
      outline: 3px solid var(--cyan);
      animation: pulse-counter 1.2s infinite;
    }

    @keyframes pulse-counter {
      0%, 100% { box-shadow: 0 0 8px rgba(0, 255, 204, 0.5); }
      50% { box-shadow: 0 0 20px rgba(0, 255, 204, 0.95); }
    }

    .floating-panel .card { width: 64px; height: 96px; }

    /* Aperçu carte — appui long */
    .card-inspect {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      pointer-events: none;
    }

    .card-inspect.hidden { display: none; }

    .card-inspect__backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(4px);
    }

    .card-inspect__panel {
      position: relative;
      z-index: 1;
      width: min(340px, 92vw);
      background: linear-gradient(160deg, #1a1a1a, #0d0d0d);
      border: 2px solid var(--accent);
      border-radius: 16px;
      padding: 20px 18px 16px;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.7), 0 0 30px var(--accent-glow);
      animation: inspect-in 0.2s ease-out;
    }

    @keyframes inspect-in {
      from { opacity: 0; transform: scale(0.92) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .card-inspect__preview {
      display: flex;
      justify-content: center;
      margin-bottom: 14px;
    }

    .card-inspect__preview .card {
      width: 120px;
      height: 180px;
      pointer-events: none;
    }

    .card-inspect__preview .card-face__icon { font-size: 2.4rem; }
    .card-inspect__preview .card-face__name { font-size: 0.75rem; }
    .card-inspect__preview .card-face__badge { font-size: 0.72rem; }

    .card-inspect__title {
      color: var(--cyan);
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .card-inspect__desc {
      color: #ccc;
      font-size: 0.92rem;
      line-height: 1.55;
      text-align: left;
    }

    .card-inspect__hint {
      margin-top: 12px;
      font-size: 0.75rem;
      color: #666;
    }

    .card.hold-hint .card-inner {
      box-shadow: 0 0 16px rgba(0, 255, 204, 0.5);
      transform: scale(1.04);
    }

    .card.hold-hint::after {
      content: "ℹ️";
      position: absolute;
      top: -6px;
      right: -6px;
      font-size: 0.65rem;
      z-index: 5;
    }

    .card { position: relative; touch-action: manipulation; user-select: none; -webkit-user-select: none; }

    .firebase-status {
      margin-top: 8px;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.88em;
      max-width: 420px;
      line-height: 1.4;
    }

    .firebase-status.ok { background: rgba(0,170,0,0.12); border: 1px solid #0a0; color: #8f8; }
    .firebase-status.error { background: rgba(255,51,51,0.12); border: 1px solid var(--accent); color: #faa; text-align: left; }
    .firebase-status.loading { background: rgba(255,170,0,0.12); border: 1px solid #fa0; color: #fd8; }

    @media (max-width: 768px) {
      :root { --hand-h: 130px; }
      .player { min-width: 72px; padding: 6px 8px; font-size: 0.75rem; }
      .card { width: 58px; height: 87px; }
      .floating-panel .card { width: 56px; height: 84px; }
      .app-main { padding-bottom: calc(var(--hand-h) + 16px); }
      .action-banner { top: 52px; font-size: 0.9rem; }
    }

    @media (min-width: 900px) {
      :root { --hand-h: 165px; }
      .card { width: 80px; height: 120px; }
      .circle { width: 440px; height: 440px; }
    }

    body.panel-open .app-main {
      padding-bottom: calc(var(--hand-h) + 200px);
    }

    body.panel-open .hand-label { display: none; }

    body:not(.in-game) .hand,
    body:not(.in-game) .hand-label,
    body:not(.in-game) .floating-panel,
    body:not(.in-game) .action-banner { display: none !important; }
  </style>
</head>
<body>

<header class="app-header">
  <div>
    <div class="app-title">😈 DIABLE NOIR</div>
    <div class="app-subtitle">Multijoueur en ligne</div>
  </div>
  <div class="header-actions">
    <button id="quitBtn" class="quit-btn hidden" onclick="gameController.quitAndReset()" title="Quitter et nouvelle partie">🚪 Quitter</button>
  </div>
</header>

<main class="app-main">

<div id="login" class="screen">
  <div class="login-container">
    <input id="pseudo" placeholder="Pseudo" autocomplete="off">
    <button id="joinBtn" onclick="gameController.join()">Entrer</button>
  </div>
  <div id="firebaseStatus" class="firebase-status loading">Connexion à Firebase…</div>
</div>

<div id="game" class="screen hidden">
  <div class="game-container">
    <div class="top-section">
      <button id="startBtn" class="hidden" onclick="gameController.start()">▶ Démarrer la partie</button>
    </div>
    <div class="status-bar">
      <div id="center" class="center-info">En attente...</div>
      <div id="message" class="message"></div>
    </div>
    <div id="circle" class="circle"></div>
  </div>
</div>

</main>

<div id="actionBanner" class="action-banner hidden">
  <h3 id="bannerTitle"></h3>
  <p id="bannerText"></p>
</div>

<div id="reactionPanel" class="floating-panel hidden">
  <h3 id="reactionTitle">⚔️ Tu es visé !</h3>
  <p id="reactionText"></p>
  <div id="reactionCards" class="panel-cards"></div>
  <button class="panel-pass" onclick="gameController.declineReaction()">Passer (subir l'effet)</button>
</div>

<div id="pickpocketPanel" class="floating-panel hidden">
  <h3>🥷 Pickpocket — choisis une carte</h3>
  <p id="pickpocketText"></p>
  <div id="pickpocketCards" class="panel-cards"></div>
</div>

<div id="handLabel" class="hand-label hidden">Ta main — appui long pour lire la carte</div>
<div id="hand" class="hand"></div>

<div id="cardInspect" class="card-inspect hidden" aria-hidden="true">
  <div class="card-inspect__backdrop"></div>
  <div class="card-inspect__panel">
    <div id="cardInspectPreview" class="card-inspect__preview"></div>
    <h3 id="cardInspectTitle" class="card-inspect__title"></h3>
    <p id="cardInspectDesc" class="card-inspect__desc"></p>
    <p class="card-inspect__hint">Relâche pour fermer · clic rapide pour jouer</p>
  </div>

const FirebaseSetup = (() => {
  let db = null;
  let ready = false;
  let errorMessage = "";

  function setStatus(type, html) {
    const el = document.getElementById("firebaseStatus");
    if (!el) return;
    el.className = `firebase-status ${type}`;
    el.innerHTML = html;
  }

  function validateConfig(config) {
    if (!config?.apiKey || config.apiKey === "VOTRE_API_KEY") {
      return "Configuration Firebase invalide.";
    }
    if (!config.databaseURL?.startsWith("https://")) {
      return "databaseURL Firebase invalide.";
    }
    return "";
  }

  function formatError(err) {
    const code = err?.code || "";
    const msg = err?.message || String(err);
    if (code === "PERMISSION_DENIED") {
      return "Accès refusé par Firebase.\n\n→ Console Firebase → Realtime Database → Règles\n→ Autorisez read/write pour tester:\n\n{\n  \"rules\": {\n    \".read\": true,\n    \".write\": true\n  }\n}";
    }
    if (msg.includes("API key not valid") || msg.includes("INVALID_API_KEY")) {
      return "Clé API refusée. Firebase Console → Paramètres → Domaines autorisés : ajoutez vicw68-bit.github.io";
    }
    if (msg.includes("Failed to fetch") || msg.includes("NetworkError")) {
      return "Impossible de joindre Firebase (réseau ou pare-feu).";
    }
    return msg;
  }

  function init() {
    const configError = validateConfig(typeof FIREBASE_CONFIG !== "undefined" ? FIREBASE_CONFIG : null);
    if (configError) {
      errorMessage = configError;
      setStatus("error", configError.replace(/\n/g, "<br>"));
      return null;
    }

    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.database();
    } catch (err) {
      errorMessage = formatError(err);
      setStatus("error", errorMessage.replace(/\n/g, "<br>"));
      return null;
    }

    db.ref(".info/connected").on("value", (snap) => {
      if (snap.val() === true) {
        ready = true;
        setStatus("ok", "✅ Connecté — entrez un pseudo pour rejoindre la partie");

      .catch((err) => {
        ready = false;
        errorMessage = formatError(err);
        setStatus("error", errorMessage.replace(/\n/g, "<br>"));
      });

    return db;
  }

  return {
    init,
    get db() { return db; },
    get ready() { return ready; },
    get errorMessage() { return errorMessage; },
    formatError,
    setStatus,
  };
})();

function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/** Appui long : description tant que le doigt/souris est maintenu */
const CardInspect = {
  HOLD_MS: 420,
  MOVE_PX: 14,
  _timer: null,
  _activeEl: null,
  _startX: 0,
  _startY: 0,
  _showing: false,
  _suppressClick: false,

  attach(el, card) {
    el.addEventListener("click", (e) => {
      if (this._suppressClick) {
        e.preventDefault();
        e.stopImmediatePropagation();
        this._suppressClick = false;
      }
    }, true);

    const onDown = (x, y) => {
      this._clearTimer();
      this._activeEl = el;
      this._startX = x;
      this._startY = y;
      this._showing = false;

      el.classList.add("hold-hint");
      this._timer = setTimeout(() => {
        if (this._activeEl !== el) return;
        this._showing = true;
        this.show(card);
        if (navigator.vibrate) navigator.vibrate(12);
      }, this.HOLD_MS);
    };

    const onMove = (x, y) => {
      if (this._activeEl !== el) return;
      if (Math.hypot(x - this._startX, y - this._startY) > this.MOVE_PX) this._cancelHold(el);
    };

    const onUp = () => {
      if (this._activeEl !== el) return;
      if (this._showing) this._suppressClick = true;
      this._cancelHold(el);
      this.hide();
    };

    el.addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return;
      onDown(e.clientX, e.clientY);
    });
    el.addEventListener("pointermove", (e) => onMove(e.clientX, e.clientY));
    el.addEventListener("pointerup", onUp);
    el.addEventListener("pointercancel", onUp);
    el.addEventListener("pointerleave", (e) => {
      if (this._showing && this._activeEl === el) this.hide();
      if (this._activeEl === el && e.buttons === 0) this._cancelHold(el);
    });
  },

  _clearTimer() {
    if (this._timer) {
      clearTimeout(this._timer);
      this._timer = null;
    }
  },

  _cancelHold(el) {
    this._clearTimer();
    el?.classList.remove("hold-hint");
    this._activeEl = null;
    this._showing = false;
  },

  show(card) {
    const overlay = document.getElementById("cardInspect");
    const preview = document.getElementById("cardInspectPreview");
    if (!overlay || !preview) return;

    preview.innerHTML = "";
    const big = document.createElement("div");
    big.className = "card";
    if (card.id === "DIABLE_NOIR" || card.id === "CURSE") big.classList.add("diable-noir");
    CardVisuals.fillCardElement(big, card, { inspect: false });
    preview.appendChild(big);

    document.getElementById("cardInspectTitle").textContent = card.name;
    document.getElementById("cardInspectDesc").textContent = CardVisuals.description(card);
    overlay.classList.remove("hidden");
    overlay.setAttribute("aria-hidden", "false");
  },

  hide() {
    const overlay = document.getElementById("cardInspect");
    if (!overlay) return;
    overlay.classList.add("hidden");
    overlay.setAttribute("aria-hidden", "true");
    document.querySelectorAll(".card.hold-hint").forEach(el => el.classList.remove("hold-hint"));
    this._showing = false;
    this._activeEl = null;
  },
};
